Item('ghanaPostStockBackup', JSON.stringify(STATE.monthlyStock)); } catch(e) {} await masterSync(`✅ Stock figures updated for ${curMonth}`, null); renderStockManagement(); };

// ─── Helper: getLedgerDistributed ───────────────────────────
function getLedgerDistributed(month){
  const distEms=[0,0,0,0,0], distPar=[0,0,0,0,0];
  BRANCHES.forEach(b=>{
    const rec=STATE.ledger[month]?.[b.id];
    if(!rec) return;
    BOXES.forEach((bk,i)=>{ distEms[i]+=(rec[bk+'_ems']||0); distPar[i]+=(rec[bk+'_parcel']||0); });
  });
  return {distEms, distPar};
}

function renderStockReports(){ if(!['EMS Coordinator','Audit','Regional Head'].includes(STATE.user.role)){ toast('Access denied','err'); return; }
if(!_stockRptMonth) _stockRptMonth = STATE.month;
const curMonth=_stockRptMonth;

const recvParArr = st.receivedPar||[0,0,0,0,0];

window.generateReport=function(){const type=document.getElementById('rptType').value;const dist=document.getElementById('rptDist')?.value||'ALL';const role=STATE.user.role;let months=[];if(type==='monthly') months=[document.getElementById('rptMonth').value];else if(type==='quarterly') months=JSON.parse(document.getElementById('rptQtr').value);else{const yr=document.getElementById('rptYear').value;months=MONTHS.filter(m=>m.endsWith(yr));}let scope=visibleBranches();if(dist&&dist!=='ALL') scope=scope.filter(b=>b.district===dist);const win=window.open('','_blank');const rTitle=type==='monthly'?months[0]:type==='quarterly'?`Quarter: ${months[0]} – ${months[months.length-1]}`:`Year: ${document.getElementById('rptYear')?.value||''}`;const dLabel=dist==='ALL'?'All Districts':dist;let html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Ghana Post — ${rTitle}</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;padding:16px 20px;font-size:9.5pt;color:#1e293b}.rpt-header{text-align:center;border-bottom:3px solid #004aad;padding-bottom:12px;margin-bottom:16px}.rpt-header h1{color:#004aad;font-size:15pt;margin:0 0 4px}.rpt-header p{color:#475569;margin:2px 0;font-size:9pt}h2{color:#004aad;font-size:11pt;margin:16px 0 6px;border-left:4px solid #f48c06;padding-left:8px}h3{color:#1e40af;font-size:9.5pt;margin:12px 0 4px;background:#f1f5f9;padding:5px 8px;border-radius:4px}table{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:8pt}th,td{border:1px solid #cbd5e1;padding:4px 5px;text-align:center}th{background:#dbeafe;color:#1e40af;font-weight:700;font-size:7.5pt}.tl{text-align:left;font-weight:600;min-width:120px}.pos{color:#15803d;font-weight:700}.neg{color:#b91c1c;font-weight:700}.tot{background:#dbeafe;font-weight:700;font-size:8.5pt}.gtot{background:#1e40af;color:#fff;font-weight:700;font-size:8.5pt}.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.kpi{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:8px;padding:10px;text-align:center}.kpi-label{font-size:7.5pt;color:#64748b;margin-bottom:4px}.kpi-val{font-size:12pt;font-weight:700;color:#004aad}.no-print-btn{background:#004aad;color:#fff;border:none;padding:8px 20px;border-radius:20px;cursor:pointer;margin-bottom:16px;font-size:10pt}@media print{.no-print-btn{display:none}}</style></head><body><div class="rpt-header"><h1>🇬🇭 GHANA POST — ACCRA WEST REGION</h1><p><strong>${rTitle}</strong> &nbsp;|&nbsp; ${dLabel} &nbsp;|&nbsp; ${role}</p><p>Generated: ${new Date().toLocaleString('en-GH',{dateStyle:'full',timeStyle:'short'})}</p></div><button class="no-print-btn" onclick="window.print()">🖨️ Print / Save PDF</button>`;let kSV=0,kPay=0,kCB=0,kQty=0,kOpen=0;months.forEach(m=>{scope.forEach(b=>{const r=STATE.ledger[m]?.[b.id]||blank();kSV+=r.totalSuppliesAmount;kPay+=r.payments;kCB+=r.closingBalance;kQty+=r.totalSuppliesQty;});});if(type!=='monthly'){scope.forEach(b=>{kOpen+=STATE.ledger[months[0]]?.[b.id]?.openingBalance||0;});html+=`<div class="summary-grid"><div class="kpi"><div class="kpi-label">Opening Balance</div><div class="kpi-val" style="font-size:10pt">${fmtR(kOpen)}</div></div><div class="kpi"><div class="kpi-label">Total Supply Value</div><div class="kpi-val">${fmtR(kSV)}</div></div><div class="kpi"><div class="kpi-label">Total Payments</div><div class="kpi-val" style="color:#059669">${fmtR(kPay)}</div></div><div class="kpi"><div class="kpi-label">Boxes Supplied</div><div class="kpi-val" style="color:#f48c06">${kQty.toLocaleString()}</div></div></div>`;}function bldRptTbl(branches,m){let h=`<table><thead><tr><th class="tl">Branch</th><th>Opening</th>${BOXES.map(b=>`<th colspan="3">${BOX_LABELS[b]}<br>@${RATES[b]}</th>`).join('')}<th>Supply Val.</th><th>Gen.Total</th><th>Payments</th><th>Closing</th></tr></thead><tbody>`;let op=0,sv=0,gt=0,py=0,cb=0;branches.forEach(b=>{const r=STATE.ledger[m]?.[b.id]||blank();op+=r.openingBalance;sv+=r.totalSuppliesAmount;gt+=r.generalTotalAmount;py+=r.payments;cb+=r.closingBalance;const bx=bk=>{const e=r[bk+'_ems']||0,p=r[bk+'_parcel']||0,v=(e+p)*RATES[bk];return`<td>${e}</td><td>${p}</td><td>${fmtR(v)}</td>`;};h+=`<tr><td class="tl">${b.name}</td><td>${fmtR(r.openingBalance)}</td>${BOXES.map(bx).join('')}<td>${fmtR(r.totalSuppliesAmount)}</td><td>${fmtR(r.generalTotalAmount)}</td><td>${fmtR(r.payments)}</td><td class="${r.closingBalance>=0?'pos':'neg'}">${fmtR(r.closingBalance)}</td></tr>`;});h+=`<tr class="tot"><td class="tl">TOTAL</td><td>${fmtR(op)}</td>${BOXES.map(()=>'<td colspan="3"> </td>').join('')}<td>${fmtR(sv)}</td><td>${fmtR(gt)}</td><td>${fmtR(py)}</td><td class="${cb>=0?'pos':'neg'}">${fmtR(cb)}</td></tr>`;return h+'</tbody><tr>';}function bldAggTbl(branches,months){const agg={};branches.forEach(b=>{agg[b.id]={name:b.name,district:b.district,b1e:0,b1p:0,b2e:0,b2p:0,b3e:0,b3p:0,b4e:0,b4p:0,b5e:0,b5p:0,sv:0,pay:0};});months.forEach(m=>{branches.forEach(b=>{const r=STATE.ledger[m]?.[b.id]||blank();const a=agg[b.id];a.b1e+=r.box1_ems||0;a.b1p+=r.box1_parcel||0;a.b2e+=r.box2_ems||0;a.b2p+=r.box2_parcel||0;a.b3e+=r.box3_ems||0;a.b3p+=r.box3_parcel||0;a.b4e+=r.box4_ems||0;a.b4p+=r.box4_parcel||0;a.b5e+=r.box5_ems||0;a.b5p+=r.box5_parcel||0;a.sv+=r.totalSuppliesAmount||0;a.pay+=r.payments||0;});});branches.forEach(b=>{agg[b.id].op=STATE.ledger[months[0]]?.[b.id]?.openingBalance||0;agg[b.id].cb=STATE.ledger[months[months.length-1]]?.[b.id]?.closingBalance||0;});let h=`<table><thead><tr><th class="tl">Branch</th><th>District</th>${BOXES.map(bk=>`<th colspan="2">${BOX_LABELS[bk]}<br>E/P</th>`).join('')}<th>Total Supply Val.</th><th>Opening</th><th>Closing</th><th>Total Payments</th></tr></thead><tbody>`;let tsv=0,tpay=0;branches.forEach(b=>{const a=agg[b.id];tsv+=a.sv;tpay+=a.pay;h+=`<tr><td class="tl">${a.name}</td><td>${a.district}</td><td>${a.b1e}</td><td>${a.b1p}</td><td>${a.b2e}</td><td>${a.b2p}</td><td>${a.b3e}</td><td>${a.b3p}</td><td>${a.b4e}</td><td>${a.b4p}</td><td>${a.b5e}</td><td>${a.b5p}</td><td>${fmtR(a.sv)}</td><td>${fmtR(a.op)}</td><td class="${a.cb>=0?'pos':'neg'}">${fmtR(a.cb)}</td><td>${fmtR(a.pay)}</td>`;});h+=`<tr class="tot"><td class="tl" colspan="2">TOTAL</td>${BOXES.map(()=>'<td colspan="2"> </td>').join('')}<td>${fmtR(tsv)}</td><td>—</td><td>—</td><td>${fmtR(tpay)}</td>`;return h+'</tbody></table>';}function bldYrTbl(branches,months,yr){let h=`<table><thead><tr><th>Month</th><th>Branches</th>${BOXES.map(bk=>`<th>${BOX_LABELS[bk]}</th>`).join('')}<th>Supply Val.</th><th>Payments</th><th>Closing</th></tr></thead><tbody>`;let tSV=0,tPay=0,tCB=0;const tQ=BOXES.map(()=>0);months.forEach(m=>{let sv=0,pay=0,cb=0,sup=0;const q=BOXES.map(()=>0);branches.forEach(b=>{const r=STATE.ledger[m]?.[b.id]||blank();if(r.totalSuppliesQty>0)sup++;sv+=r.totalSuppliesAmount;pay+=r.payments;cb+=r.closingBalance;BOXES.forEach((bk,i)=>{q[i]+=(r[bk+'_ems']||0)+(r[bk+'_parcel']||0);});});tSV+=sv;tPay+=pay;tCB+=cb;BOXES.forEach((_,i)=>{tQ[i]+=q[i];});h+=`<tr><td style="font-weight:600">${m}</td><td>${sup}</td>${q.map(v=>`<td>${v}</td>`).join('')}<td>${fmtR(sv)}</td><td style="color:#059669">${fmtR(pay)}</td><td class="${cb>=0?'pos':'neg'}">${fmtR(cb)}</td>`;});h+=`<tr class="tot"><td>YEAR TOTAL — ${yr}</td><td>—</td>${tQ.map(v=>`<td>${v}</td>`).join('')}<td>${fmtR(tSV)}</td><td>${fmtR(tPay)}</td><td class="${tCB>=0?'pos':'neg'}">${fmtR(tCB)}</td>`;return h+'</tbody><tr>';}if(type==='monthly'){if(dist==='ALL'&&['EMS Coordinator','Audit','Regional Head'].includes(role)){DISTRICTS.forEach(d=>{const dB=scope.filter(b=>b.district===d);if(!dB.length)return;html+=`<h2>📍 ${d} — ${months[0]}</h2>${bldRptTbl(dB,months[0])}`;});} else {html+=`<h2>📋 ${dLabel} — ${months[0]}</h2>${bldRptTbl(scope,months[0])}`;}} else if(type==='quarterly'){months.forEach(m=>{if(dist==='ALL'&&['EMS Coordinator','Audit','Regional Head'].includes(role)){html+=`<h2>📅 ${m}</h2>`;DISTRICTS.forEach(d=>{const dB=scope.filter(b=>b.district===d);if(!dB.length)return;html+=`<h3>📍 ${d}</h3>${bldRptTbl(dB,m)}`;});}else{html+=`<h2>📅 ${m} — ${dLabel}</h2>${bldRptTbl(scope,m)}`;}});html+=`<h2>📊 Quarterly Aggregate (${months[0]} → ${months[months.length-1]})</h2>${bldAggTbl(scope,months)}`;}else{const yr=document.getElementById('rptYear').value;html+=`<h2>📆 ${yr} — Monthly Summary</h2>${bldYrTbl(scope,months,yr)}`;months.forEach(m=>{if(dist==='ALL'&&['EMS Coordinator','Audit','Regional Head'].includes(role)){html+=`<h2>📅 ${m}</h2>`;DISTRICTS.forEach(d=>{const dB=scope.filter(b=>b.district===d);if(!dB.length)return;html+=`<h3>📍 ${d}</h3>${bldRptTbl(dB,m)}`;});}else{html+=`<h2>📅 ${m}</h2>${bldRptTbl(scope,m)}`;}});html+=`<h2>🏆 Annual Aggregate — ${yr}</h2>${bldAggTbl(scope,months)}`;}html+=`</body></html>`;win.document.write(html);win.document.close();document.querySelector('.modal-bg')?.remove();};
window.exportCSV=function(){const m=STATE.month,vis=visibleBranches();const rows=[['Branch','District',...BOXES.flatMap(b=>[BOX_LABELS[b]+' EMS',BOX_LABELS[b]+' Parcel']),'Total Boxes','EMS Value','Parcel Value','Supply Value','Payments','Closing']];vis.forEach(b=>{const r=STATE.ledger[m]?.[b.id]||blank();const boxes=BOXES.reduce((s,bk)=>s+(r[bk+'_ems']||0)+(r[bk+'_parcel']||0),0);const eV=BOXES.reduce((s,bk)=>s+(r[bk+'_ems']||0)*RATES[bk],0);const pV=BOXES.reduce((s,bk)=>s+(r[bk+'_parcel']||0)*RATES[bk],0);rows.push([b.name,b.district,...BOXES.flatMap(bk=>[r[bk+'_ems']||0,r[bk+'_parcel']||0]),boxes,eV,pV,r.totalSuppliesAmount,r.payments,r.closingBalance]);});const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(rows.map(r=>r.join(',')).join('\n'));a.download=`GhanaPost_${m.replace(/ /g,'_')}.csv`;a.click();toast('CSV exported');};
window.logout=function(){if(!confirm('Exit session? All data is saved to Google Sheets.')) return;if(_pollTimer) clearInterval(_pollTimer);_analyticsState={fromMonth:null,toMonth:null,focusMonth:null};_stockRptMonth=null;_stockDeductMonth=null;STATE={user:{role:null,id:null,district:null,branchId:null},month:MONTHS[0],ledger:{},requests:[],announcements:[],notifications:[],_dismissedAnn:new Set(),_dismissedNotif:new Set(),monthlyStock:{}};$('app-view').classList.add('hidden');$('login-view').style.display='flex';$('loginRole').value='';$('loginPw').value='';const rf=$('roleField');if(rf)rf.innerHTML='';};

window.forceSaveAllLedger = async function() { if (STATE.user.role !== 'EMS Coordinator') { toast('Only EMS Coordinator can perform this action', 'err'); return; } toast('Saving entire ledger to Google Sheets...', 'warn'); try { await masterSync('✅ All ledger data saved to cloud. Initial seed data is now persistent.', null); } catch (e) { toast('Save failed: ' + e.message, 'err'); } };
function generateSummaryReport(){ const m = STATE.month; const allBranches = BRANCHES; const role = STATE.user.role; function getDistrictTotals(){ let distMap = new Map(); DISTRICTS.forEach(d => distMap.set(d, { op:0, sv:0, gt:0, py:0, cb:0, qty:0, count:0 })); allBranches.forEach(b => { const r = STATE.ledger[m]?.[b.id] || blank(); const d = distMap.get(b.district); if(d){ d.op += r.openingBalance; d.sv += r.totalSuppliesAmount; d.gt += r.generalTotalAmount; d.py += r.payments; d.cb += r.closingBalance; d.qty += r.totalSuppliesQty; d.count++; } }); return distMap; } const districtMap = getDistrictTotals(); const regionOp = districtMap.get('ACCRA CENTRAL').op + districtMap.get('ACCRA NORTH').op + districtMap.get('ACCRA WEST').op; const regionSV = districtMap.get('ACCRA CENTRAL').sv + districtMap.get('ACCRA NORTH').sv + districtMap.get('ACCRA WEST').sv; const regionCB = districtMap.get('ACCRA CENTRAL').cb + districtMap.get('ACCRA NORTH').cb + districtMap.get('ACCRA WEST').cb; const regionPay = districtMap.get('ACCRA CENTRAL').py + districtMap.get('ACCRA NORTH').py + districtMap.get('ACCRA WEST').py; const negativeBranches = allBranches.filter(b => (STATE.ledger[m]?.[b.id]||blank()).closingBalance < 0); const top3 = [...allBranches].sort((a,b)=> (STATE.ledger[m]?.[b.id]||blank()).closingBalance - (STATE.ledger[m]?.[a.id]||blank()).closingBalance).slice(0,3); function fmtGHS(v){ return 'GHS ' + (v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); } let regionalReport = `📌 MONTH: ${m}\n📍 REGIONAL OVERVIEW\n\n`; regionalReport += `- Total Opening Balance: ${fmtGHS(regionOp)}\n`; regionalReport += `- Total Supply Value (cartons issued): ${fmtGHS(regionSV)}\n`; regionalReport += `- Total Payments Collected: ${fmtGHS(regionPay)}\n`; regionalReport += `- Net Closing Balance: ${fmtGHS(regionCB)}\n\n`; regionalReport += `🏛️ DISTRICT BREAKDOWN\n`; for(let [dist, d] of districtMap.entries()){ regionalReport += `• ${dist} – Opening: ${fmtGHS(d.op)} | Supply: ${fmtGHS(d.sv)} | Payments: ${fmtGHS(d.py)} | Closing: ${fmtGHS(d.cb)} (${d.count} branches)\n`; } regionalReport += `\n⭐ Top 3 Branches (by Closing Balance)\n`; top3.forEach(b=> regionalReport += `• ${b.name}: ${fmtGHS((STATE.ledger[m]?.[b.id]||blank()).closingBalance)}\n`); regionalReport += `\n⚠️ Branches with Deficit (Negative Closing)\n`; if(negativeBranches.length) negativeBranches.forEach(b=> regionalReport += `• ${b.name}: ${fmtGHS((STATE.ledger[m]?.[b.id]||blank()).closingBalance)}\n`); else regionalReport += `None\n`; const _paymentEfficiency = regionSV > 0 ? ((regionPay / regionSV) * 100).toFixed(1) : '0.0'; regionalReport += `\n📊 Payment Efficiency: ${_paymentEfficiency}% of supply value recovered.\n`; let emsReport = `📌 MONTH: ${m}\n📦 SUPPLY DISTRIBUTION\n\n`; let activeBranches = allBranches.filter(b => (STATE.ledger[m]?.[b.id]||blank()).totalSuppliesQty > 0); let totalBoxes = allBranches.reduce((sum,b)=> sum + (STATE.ledger[m]?.[b.id]||blank()).totalSuppliesQty,0); emsReport += `- Branches supplied this month: ${activeBranches.length} / ${allBranches.length}\n`; emsReport += `- Total carton boxes issued: ${totalBoxes.toLocaleString()}\n`; emsReport += `- Total Supply Value: ${fmtGHS(regionSV)}\n`; emsReport += `- Total Payments Received: ${fmtGHS(regionPay)}\n\n`; emsReport += `🏪 DISTRICT SUPPLY PERFORMANCE\n`; for(let [dist, d] of districtMap.entries()){ emsReport += `• ${dist} – Boxes: ${d.qty.toLocaleString()} | Value: ${fmtGHS(d.sv)} | Payments: ${fmtGHS(d.py)}\n`; } let zeroBranches = allBranches.filter(b => (STATE.ledger[m]?.[b.id]||blank()).totalSuppliesQty === 0); emsReport += `\n⚠️ Branches with Zero Supply Activity\n`; if(zeroBranches.length) zeroBranches.forEach(b=> emsReport += `• ${b.name}\n`); else emsReport += `All branches received supplies.\n`; let totalEMS = 0, totalParcel = 0; allBranches.forEach(b => { const r = STATE.ledger[m]?.[b.id] || blank(); for(let bk of BOXES){ totalEMS += r[bk+'_ems'] || 0; totalParcel += r[bk+'_parcel'] || 0; } }); let auditReport = `📌 MONTH: ${m}\n🔍 EMS vs PARCEL AUDIT LOG\n\n`; auditReport += `- Total EMS boxes issued: ${totalEMS.toLocaleString()}\n`; auditReport += `- Total Parcel boxes issued: ${totalParcel.toLocaleString()}\n`; auditReport += `- Ratio (EMS : Parcel): ${totalEMS}:${totalParcel}\n\n`; auditReport += `💰 FINANCIAL RECONCILIATION\n`; auditReport += `- Total Supply Value (ledger): ${fmtGHS(regionSV)}\n`; auditReport += `- Total Payments collected: ${fmtGHS(regionPay)}\n`; auditReport += `- Outstanding balance (Supply – Payments): ${fmtGHS(regionSV - regionPay)}\n\n`; auditReport += `⚠️ Branches with Negative Closing Balance (potential over‑supply or under‑payment)\n`; if(negativeBranches.length) negativeBranches.forEach(b=> auditReport += `• ${b.name}: ${fmtGHS((STATE.ledger[m]?.[b.id]||blank()).closingBalance)}\n`); else auditReport += `None\n`; let finalReport = ""; if(role === "Regional Head") finalReport = regionalReport; else if(role === "EMS Coordinator") finalReport = emsReport; else if(role === "Audit") finalReport = auditReport; else finalReport = `Role-specific summary not defined for ${role}. Showing full management view:\n\n${regionalReport}\n\n---\n${emsReport}\n\n---\n${auditReport}`; const modal = document.createElement('div'); modal.className = 'modal-bg'; modal.innerHTML = `<div class="modal" style="max-width:700px"><div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px"><h3>📋 Summary Report – ${m}</h3><button class="btn btn-sm" onclick="this.closest('.modal-bg').remove()">✕ Close</button></div><div style="background:#f8fafc; padding:16px; border-radius:12px; white-space:pre-wrap; font-family:monospace; font-size:0.85rem; line-height:1.5; max-height:60vh; overflow-y:auto">${finalReport.replace(/\n/g,'<br>')}</div><div style="margin-top:16px; display:flex; gap:10px; justify-content:flex-end"><button class="btn btn-ghost btn-sm" onclick="navigator.clipboard.writeText(finalReport.replace(/<br>/g,'\\n')); toast('Report copied','ok')">📋 Copy to Clipboard</button><button class="btn btn-primary btn-sm" onclick="window.print()">🖨️ Print Report</button></div></div>`; document.body.appendChild(modal); }

function renderCustomerFeedback(){ if(_feedbackTimer){ clearInterval(_feedbackTimer); _feedbackTimer=null; } $('mainContent').innerHTML=`${annContainer()}<div class="page-header"><div class="page-title">💬 Customer Feedback</div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span id="feedbackLastRefresh" style="font-size:.72rem;color:var(--muted)">Loading…</span><button class="btn btn-ghost btn-sm" onclick="refreshFeedbackFrame()">🔄 Refresh Now</button></div></div><div class="card" style="padding:0;overflow:hidden;border-radius:16px;position:relative"><div id="feedbackFlash" style="display:none;position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--success);color:#fff;padding:5px 18px;border-radius:20px;font-size:.75rem;font-weight:700;z-index:10;pointer-events:none">✅ Updated</div><iframe id="feedbackFrame" src="${FEEDBACK_EMBED_URL}" style="width:100%;height:calc(100vh - 210px);min-height:500px;border:none;display:block" sandbox="allow-scripts allow-same-origin" title="Customer Feedback"></iframe></div>`; _updateFeedbackTime(); _feedbackTimer = setInterval(()=>{ if(document.querySelector('.nav-btn.active')?.dataset.tab === 'customerFeedback') refreshFeedbackFrame(true); else { clearInterval(_feedbackTimer); _feedbackTimer=null; } }, 18000); }
