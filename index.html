<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=yes">
<title>Ghana Post – Accra West | Ledger &amp; Supply</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<style>
/* ========== ORIGINAL STYLES – EXACTLY AS WORKING ========== */
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
:root{--blue:#004aad;--blue2:#1e40af;--blue-light:#dbeafe;--orange:#f48c06;--success:#10b981;--danger:#dc2626;--warning:#f59e0b;--bg:#f0f4f8;--card:#fff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;--sidebar-w:260px;--shadow:0 4px 20px rgba(0,74,173,.10);}
body{background:var(--bg);min-height:100vh;display:flex;flex-direction:column;overflow:hidden}
.hidden{display:none!important}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#f1f5f9}
::-webkit-scrollbar-thumb{background:#94a3b8;border-radius:3px}
.btn{padding:8px 18px;border-radius:30px;border:none;font-weight:600;cursor:pointer;transition:.2s;font-size:.82rem;display:inline-flex;align-items:center;gap:5px}
.btn:hover{filter:brightness(.93);transform:translateY(-1px)}
.btn-primary{background:var(--blue);color:#fff}
.btn-orange{background:var(--orange);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:#f1f5f9;color:var(--text)}
.btn-sm{padding:5px 12px;font-size:.75rem}
input,select,textarea{padding:10px 13px;border:1.5px solid var(--border);border-radius:10px;width:100%;font-size:.88rem;background:#fff;transition:.2s;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,74,173,.1)}
label{font-weight:600;font-size:.73rem;color:var(--muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border-radius:18px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px;border:1px solid rgba(0,0,0,.04);overflow-x:auto;}
.kpi-card{background:linear-gradient(135deg,var(--blue) 0%,var(--blue2) 100%);color:#fff;border-radius:16px;padding:18px 20px;box-shadow:0 6px 20px rgba(0,74,173,.3)}
.kpi-card.orange{background:linear-gradient(135deg,#f48c06,#ea580c)}
.kpi-card.green{background:linear-gradient(135deg,#10b981,#059669)}
.kpi-card.red{background:linear-gradient(135deg,#dc2626,#b91c1c)}
.kpi-val{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;margin:4px 0}
.kpi-label{font-size:.72rem;opacity:.85;text-transform:uppercase;letter-spacing:.06em}
.kpi-sub{font-size:.72rem;opacity:.75;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:.72rem;min-width:780px;}
th,td{border:1px solid var(--border);padding:6px 5px;text-align:center;white-space:nowrap}
th{background:#f8fafc;color:var(--blue);font-weight:700;position:sticky;top:0;z-index:2;font-size:.68rem}
.tl{text-align:left;font-weight:600;min-width:140px}
.pos{color:#15803d;font-weight:700}
.neg{color:#b91c1c;font-weight:700}
.tot-row{background:#dbeafe;font-weight:700}
.gtot-row{background:var(--blue2);color:#fff;font-weight:700}
.gtot-row td{color:#fff!important}
.district-header-row{background:linear-gradient(90deg,var(--blue),var(--blue2));color:#fff;font-weight:700}
.district-header-row td{color:#fff!important;padding:8px 5px;font-size:.75rem;text-align:left}
.district-subtotal-row{background:#e0e7ff;font-weight:700;border-top:2px solid var(--blue)}
.sub-header-row{background:#f1f5f9;font-weight:600}
.sub-header-row th{background:#f1f5f9;color:var(--blue2);font-size:.66rem}
#login-view{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#004aad 0%,#001f5b 60%,#003380 100%);position:relative;overflow:hidden}
.login-card{background:rgba(255,255,255,.97);border-radius:24px;padding:36px;max-width:440px;width:90%;box-shadow:0 24px 60px rgba(0,0,0,.35);backdrop-filter:blur(10px);position:relative;z-index:1}
#app-view{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,#003380 0%,#001f5b 100%);color:#fff;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;box-shadow:4px 0 20px rgba(0,0,0,.2);transition: left 0.3s ease; z-index: 1000;}
.brand{padding:20px 16px;background:rgba(0,0,0,.2);text-align:center;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-title{font-size:.95rem;font-weight:800;letter-spacing:.02em}
.brand-sub{font-size:.7rem;opacity:.7;margin-top:2px}
.user-pill{margin:12px;background:rgba(255,255,255,.08);border-radius:12px;padding:12px 14px;border:1px solid rgba(255,255,255,.1)}
.user-role{font-weight:700;font-size:.9rem}
.user-loc{font-size:.72rem;opacity:.75;margin-top:2px}
.sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#f59e0b;margin-right:5px;vertical-align:middle}
.sync-dot.live{background:#10b981}
.sync-txt{font-size:.67rem;opacity:.7;margin-top:6px}
nav{padding:10px 10px}
.nav-section{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.4);padding:10px 8px 4px}
.nav-btn{width:100%;text-align:left;background:transparent;border:none;color:rgba(255,255,255,.75);padding:10px 14px;font-weight:500;cursor:pointer;border-radius:10px;transition:.2s;font-size:.83rem;display:flex;align-items:center;gap:8px;margin-bottom:2px;position:relative}
.nav-btn:hover,.nav-btn.active{background:rgba(255,255,255,.12);color:#fff}
.nav-btn.active{background:rgba(255,255,255,.18);font-weight:700}
.nav-badge{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:#dc2626;color:#fff;border-radius:20px;padding:2px 7px;font-size:.62rem;font-weight:800;min-width:18px;text-align:center}
.sidebar-footer{padding:14px;margin-top:auto}
main{flex:1;overflow-y:auto;padding:22px 26px;background:var(--bg)}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.page-title{font-size:1.4rem;font-weight:800;color:var(--text)}
.month-badge{background:#fff;padding:6px 16px;border-radius:40px;font-weight:700;color:var(--blue);border:1.5px solid var(--blue-light);font-size:.82rem;box-shadow:0 2px 8px rgba(0,74,173,.08)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:18px;margin-bottom:20px}
.chart-box{background:#fff;border-radius:16px;padding:18px;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.04)}
.chart-title{font-weight:700;font-size:.85rem;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.dist-hdr{background:linear-gradient(90deg,var(--blue),var(--blue2));color:#fff;padding:9px 16px;border-radius:10px 10px 0 0;font-weight:700;font-size:.8rem;display:flex;align-items:center;gap:6px;margin-top:14px}
.toast{position:fixed;top:20px;right:20px;background:#fff;padding:13px 20px;border-radius:40px;box-shadow:0 8px 24px rgba(0,0,0,.15);border-left:5px solid var(--success);z-index:9999;font-weight:600;font-size:.85rem;animation:toastIn .3s ease-out;max-width:340px}
@keyframes toastIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.err{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warning)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,30,.5);z-index:1000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal{background:#fff;border-radius:22px;padding:28px;max-width:700px;width:92%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.ai-box{background:linear-gradient(135deg,#eff6ff,#e0f2fe);border:1px solid #bae6fd;border-radius:14px;padding:16px;margin-bottom:18px;position:relative}
.ai-box .ai-icon{font-size:1.4rem;margin-bottom:6px}
.ai-box p{font-size:.82rem;color:#1e3a5f;line-height:1.6}
.ai-loading{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
.spinner{width:16px;height:16px;border:2px solid #e2e8f0;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.req-box{background:#fef9e8;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid #ffe0a3}
.announcement-banner{background:linear-gradient(90deg,#004aad,#1e40af);color:#fff;padding:11px 16px;border-radius:12px;margin-bottom:12px;display:flex;align-items:flex-start;gap:12px;animation:slideDown .3s ease-out}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.ann-icon{font-size:1.2rem;flex-shrink:0;margin-top:2px}
.ann-body{flex:1;min-width:0}
.ann-title{font-weight:700;font-size:.85rem;margin-bottom:2px}
.ann-text{font-size:.78rem;opacity:.92;line-height:1.5;word-break:break-word}
.ann-meta{font-size:.67rem;opacity:.6;margin-top:4px}
.ann-dismiss{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:20px;padding:4px 11px;font-size:.7rem;cursor:pointer;flex-shrink:0;align-self:flex-start;margin-top:2px;white-space:nowrap}
.ann-dismiss:hover{background:rgba(255,255,255,.28)}
.notif-item{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:10px;border:1px solid var(--border);border-left:4px solid var(--blue);transition:.2s}
.notif-item.unread{background:#eff6ff}
.notif-item.fulfilled{border-left-color:var(--success)}
.notif-item.request{border-left-color:var(--warning)}
.notif-item.status_update{border-left-color:#7c3aed}
.notif-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.notif-title{font-weight:700;font-size:.83rem;color:var(--text);margin-bottom:3px}
.notif-time{font-size:.68rem;color:var(--muted);white-space:nowrap}
.notif-body{font-size:.78rem;color:#475569;line-height:1.55}
.notif-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.65rem;font-weight:700;margin-left:5px;vertical-align:middle}
.nb-new{background:#fef3c7;color:#92400e}
.nb-fulfilled{background:#d1fae5;color:#065f46}
.nb-pending{background:#fee2e2;color:#991b1b}
.nb-update{background:#ede9fe;color:#5b21b6}
.ledger-snap{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:8px 10px;margin-top:8px;font-size:.74rem;color:#166534;line-height:1.6}
/* ====== CARTON LOADING SCREEN ====== */
#loading-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#003380 0%,#001f5b 55%,#004aad 100%);z-index:9998;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;overflow:hidden;}
#loading-overlay.hidden{display:none!important}
.load-bg-dot{position:absolute;border-radius:50%;opacity:.07;animation:floatDot linear infinite;}
@keyframes floatDot{0%{transform:translateY(110vh) scale(0.5)}100%{transform:translateY(-10vh) scale(1.2)}}
.carton-wrap{position:relative;width:120px;height:140px;margin-bottom:28px;animation:cartonBounce 1.6s ease-in-out infinite;}
@keyframes cartonBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.carton-shadow{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);width:80px;height:14px;background:rgba(0,0,0,.35);border-radius:50%;animation:shadowPulse 1.6s ease-in-out infinite;filter:blur(4px);}
@keyframes shadowPulse{0%,100%{width:80px;opacity:.35}50%{width:55px;opacity:.18}}
.load-bar-track{width:220px;height:6px;background:rgba(255,255,255,.15);border-radius:10px;overflow:hidden;margin-top:6px;}
.load-bar-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,#60a5fa,#38bdf8,#7dd3fc);animation:barFill 2.8s ease-in-out infinite;transform-origin:left;}
@keyframes barFill{0%{width:0%}60%{width:85%}85%{width:92%}100%{width:100%}}
.sparkle{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;opacity:0;animation:sparkAnim 2s ease-in-out infinite;}
@keyframes sparkAnim{0%,100%{opacity:0;transform:scale(0)}40%{opacity:.9;transform:scale(1)}70%{opacity:.4;transform:scale(0.5)}}
.load-txt{font-size:1.05rem;font-weight:700;letter-spacing:.02em;margin-bottom:4px;text-shadow:0 2px 8px rgba(0,0,0,.3);}
.load-sub{font-size:.78rem;opacity:.65;margin-bottom:18px;min-height:1.2em;transition:opacity .3s;}
.load-steps{display:flex;gap:6px;margin-top:14px;}
.load-step{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25);transition:background .4s,transform .4s;}
.load-step.done{background:#38bdf8;transform:scale(1.25);}
.load-step.active{background:#fff;transform:scale(1.4);box-shadow:0 0 8px rgba(255,255,255,.7);}
/* ==================================== */
.migration-box{background:linear-gradient(135deg,#fef3c7,#fffbeb);border:2px dashed #f59e0b;border-radius:16px;padding:20px;margin-bottom:18px}
.migration-box h3{color:#92400e;font-size:.95rem;margin-bottom:8px}
.migration-box p{font-size:.8rem;color:#78350f;line-height:1.55;margin-bottom:12px}
@media print{
  .sidebar,.btn,.no-print,.toast,nav,.announcement-banner{display:none!important}
  body,main,#app-view{height:auto;overflow:visible;padding:0}
  .card{box-shadow:none;border:1px solid #ccc;page-break-inside:avoid}
  table{font-size:7.5pt}th,td{padding:3px 4px}
}
.drawer-toggle{display:none;background:var(--blue);color:white;border:none;font-size:1.3rem;padding:0.5rem 1rem;border-radius:12px;margin-bottom:1rem;width:auto;cursor:pointer;}
@media (max-width:768px){
.drawer-toggle{display:inline-flex}
.sidebar{position:fixed;top:0;left:-280px;width:280px;height:100%;z-index:1000;transition:left 0.3s ease;background:linear-gradient(180deg,#003380 0%,#001f5b 100%);}
.sidebar.open{left:0}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;display:none}
.sidebar-overlay.active{display:block}
.card { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { display: table; width: 100%; min-width: 720px; font-size: 0.7rem; }
thead { display: table-header-group; }
tbody { display: table-row-group; }
tr { display: table-row; background: white; margin: 0; border: none; border-radius: 0; }
th, td { display: table-cell; padding: 8px 5px; white-space: nowrap; border: 1px solid var(--border); text-align: center; }
th { background: #f8fafc; }
td::before { display: none; }
.kpi-grid { grid-template-columns: repeat(2,1fr); gap: 8px; }
.kpi-val { font-size: 1.2rem; }
.kpi-card { padding: 12px; }
.page-title { font-size: 1.2rem; }
main { padding: 16px; }
.chart-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="toast-area"></div>
<div id="loading-overlay" class="hidden">
  <!-- floating background bubbles -->
  <div class="load-bg-dot" style="width:180px;height:180px;background:#60a5fa;left:10%;animation-duration:9s;animation-delay:0s;"></div>
  <div class="load-bg-dot" style="width:100px;height:100px;background:#38bdf8;left:65%;animation-duration:7s;animation-delay:2s;"></div>
  <div class="load-bg-dot" style="width:140px;height:140px;background:#93c5fd;left:40%;animation-duration:11s;animation-delay:1s;"></div>

  <!-- bouncing carton SVG -->
  <div class="carton-wrap">
    <svg viewBox="0 0 120 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;filter:drop-shadow(0 8px 24px rgba(0,74,173,.5))">
      <!-- box body -->
      <rect x="10" y="45" width="100" height="75" rx="6" fill="#ffffff" stroke="#dbeafe" stroke-width="1.5"/>

      <rect x="10" y="45" width="100" height="75" rx="6" fill="url(#boxGrad)"/>

      <polygon points="10,45 10,120 0,110 0,35" fill="#c7d2fe" opacity="0.7"/>
      <!-- top flap closed -->
      <polygon points="10,45 60,30 110,45 60,55" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>

      <polygon points="10,45 60,30 60,55 35,50" fill="#dbeafe"/>

      <polygon points="110,45 60,30 60,55 85,50" fill="#bfdbfe"/>

        <rect x="30" y="108" width="2" height="8" fill="#004aad"/>
        <rect x="34" y="108" width="1" height="8" fill="#004aad"/>
        <rect x="37" y="108" width="3" height="8" fill="#004aad"/>
        <rect x="42" y="108" width="1" height="8" fill="#004aad"/>
        <rect x="45" y="108" width="2" height="8" fill="#004aad"/>
        <rect x="49" y="108" width="4" height="8" fill="#004aad"/>
        <rect x="55" y="108" width="1" height="8" fill="#004aad"/>
        <rect x="58" y="108" width="3" height="8" fill="#004aad"/>
        <rect x="63" y="108" width="2" height="8" fill="#004aad"/>
        <rect x="67" y="108" width="1" height="8" fill="#004aad"/>
        <rect x="70" y="108" width="4" height="8" fill="#004aad"/>
        <rect x="76" y="108" width="2" height="8" fill="#004aad"/>
        <rect x="80" y="108" width="1" height="8" fill="#004aad"/>
        <rect x="83" y="108" width="3" height="8" fill="#004aad"/>
        <rect x="88" y="108" width="2" height="8" fill="#004aad"/>

      <circle cx="85" cy="75" r="14" fill="none" stroke="#f48c06" stroke-width="1.5" opacity="0.5"/>

      <text x="85" y="72" text-anchor="middle" font-size="5" fill="#f48c06" font-family="Segoe UI,sans-serif" opacity="0.7">EMS</text>

          <stop offset="0%" stop-color="#eff6ff" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#1e40af" stop-opacity="0.08"/>

      </defs>
    </svg>
    <!-- sparkles -->
    <div class="sparkle" style="top:5px;left:15px;animation-delay:0s;width:5px;height:5px;background:#fbbf24;"></div>
    <div class="sparkle" style="top:10px;right:12px;animation-delay:.7s;width:4px;height:4px;"></div>

    <!-- shadow -->
    <div class="carton-shadow"></div>
  </div>

  <div class="load-txt">Ghana Post — Accra West</div>
  <div class="load-sub" id="loadSubTxt">Authenticating…</div>

    <div class="load-step active" id="lstep0"></div>

function seed(){
  // Only seed months that were NOT returned by the cloud load.
  // This means cloud data always wins — seed is a fallback for months
  // Google Sheets has no record of (e.g. future months, or first-time use).
  MONTHS.forEach(m=>{if(!STATE.ledger[m]) STATE.ledger[m]={};});
  Object.entries(EXCEL_SEED).forEach(([month,branches])=>{
    // Skip this month entirely if cloud already loaded it
    if(_cloudLoadedMonths.has(month)) return;
    if(!STATE.ledger[month]) STATE.ledger[month]={};
    Object.entries(branches).forEach(([bid,rec])=>{
      if(!rec||Object.keys(rec).length===0) return;
      // Also skip individual branch records already set by cloud
      if(STATE.ledger[month][bid] &&
         (STATE.ledger[month][bid].totalSuppliesQty > 0 ||
          STATE.ledger[month][bid].openingBalance !== 0 ||
          STATE.ledger[month][bid].payments > 0)) return;
      STATE.ledger[month][bid]={openingBalance:rec.openingBalance||0,box1_ems:rec.box1_ems||0,box1_parcel:rec.box1_parcel||0,box2_ems:rec.box2_ems||0,box2_parcel:rec.box2_parcel||0,box3_ems:rec.box3_ems||0,box3_parcel:rec.box3_parcel||0,box4_ems:rec.box4_ems||0,box4_parcel:rec.box4_parcel||0,box5_ems:rec.box5_ems||0,box5_parcel:rec.box5_parcel||0,payments:rec.payments||0,totalSuppliesAmount:0,totalSuppliesQty:0,generalTotalAmount:0,closingBalance:0};

}
function initMonthlyStock(){

    if(!STATE.monthlyStock[m]) {
      STATE.monthlyStock[m] = {
        openingEms: [0,0,0,0,0],
        openingPar: [0,0,0,0,0],
        receivedEms: [0,0,0,0,0],
        receivedPar: [0,0,0,0,0],
        distributedEms: [0,0,0,0,0],
        distributedPar: [0,0,0,0,0],
        closingEms: [0,0,0,0,0],
        closingPar: [0,0,0,0,0],
        movements: []
      };
    }
    if(idx===0){
      STATE.monthlyStock[m].openingEms = [0,0,0,0,0];
      STATE.monthlyStock[m].openingPar = [0,0,0,0,0];
    } else {
      const prev = MONTHS[idx-1];
      if(STATE.monthlyStock[prev]) {
        STATE.monthlyStock[m].openingEms = [...STATE.monthlyStock[prev].closingEms];
        STATE.monthlyStock[m].openingPar = [...STATE.monthlyStock[prev].closingPar];
      } else {
        STATE.monthlyStock[m].openingEms = [0,0,0,0,0];
        STATE.monthlyStock[m].openingPar = [0,0,0,0,0];
      }
    }
    const st = STATE.monthlyStock[m];
    for(let i=0;i<5;i++){
      st.closingEms[i] = st.openingEms[i] + st.receivedEms[i] - st.distributedEms[i];
      st.closingPar[i] = st.openingPar[i] + st.receivedPar[i] - st.distributedPar[i];
    }
  });
}
function getClosingStockValue(month){
  const st = STATE.monthlyStock[month] || {closingEms:[0,0,0,0,0], closingPar:[0,0,0,0,0]};

    val += (st.closingEms[i] + st.closingPar[i]) * RATES[`box${i+1}`];

}

async function apiGet(action){
  try {
    const res=await fetch(
      API_URL+'?action='+encodeURIComponent(action)+'&secret='+encodeURIComponent(API_SECRET),
      { method:'GET', mode:'cors', credentials:'omit' }
    );
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (json && json.status === 'error') throw new Error(json.message || 'Apps Script error');
    return json;
  } catch (err) {
    console.error('apiGet error:', err);
    throw err;
  }
}
async function cloudSaveLedger(){
  try{
    const rows=[];
    MONTHS.forEach(month=>{
      BRANCHES.forEach(branch=>{
        const r=STATE.ledger[month]?.[branch.id];
        if(!r) return;
        // Only save rows that have REAL user-entered data:
        // - Must have actual supply quantities OR payments entered
        // - Opening balance alone (carried forward) is NOT enough to save
        // - This prevents overwriting cloud data with zero-box rows on reload
        const hasSupplies = (r.box1_ems||0)+(r.box1_parcel||0)+(r.box2_ems||0)+(r.box2_parcel||0)+
                            (r.box3_ems||0)+(r.box3_parcel||0)+(r.box4_ems||0)+(r.box4_parcel||0)+
                            (r.box5_ems||0)+(r.box5_parcel||0) > 0;
        const hasPayments = (r.payments||0) > 0;
        if(!hasSupplies && !hasPayments) return;
        rows.push([month,branch.id,branch.name,branch.district,r.openingBalance,r.box1_ems,r.box1_parcel,r.box2_ems,r.box2_parcel,r.box3_ems,r.box3_parcel,r.box4_ems,r.box4_parcel,r.box5_ems,r.box5_parcel,r.payments,r.totalSuppliesAmount,r.generalTotalAmount,r.closingBalance]);
      });
    });
    if(rows.length===0){ console.warn('cloudSaveLedger: no rows to save, skipping'); return; }
    await apiPost({action:'saveLedger',rows,user:STATE.user.role});
    const ts=new Date().toLocaleTimeString('en-GH',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    const dot=$('syncDot');const txt=$('syncTxt');
    if(dot) dot.className='sync-dot live';
    if(txt) txt.innerText='Synced '+ts;
  }catch(err){
    console.error(err);
    toast('Cloud sync failed','err');
  }
}
async function cloudSaveStockData() {
  STATE.monthlyStock._lastModified = Date.now();
  localStorage.setItem('ghanaPostStockBackup', JSON.stringify(STATE.monthlyStock));
  try {
    await apiPost({ action: 'saveStockData', monthlyStock: STATE.monthlyStock, user: STATE.user.role });
    const dot = document.getElementById('stockSyncDot');
    const txt = document.getElementById('stockSyncTxt');
    if (dot) dot.className = 'sync-dot live';
    if (txt) txt.innerText = 'Stock: saved ' + new Date().toLocaleTimeString();
    setTimeout(() => { if (txt) txt.innerText = 'Stock: live'; }, 2000);
  } catch(e) {
    console.error('Cloud save failed, but kept in browser', e);
    const dot = document.getElementById('stockSyncDot');
    const txt = document.getElementById('stockSyncTxt');
    if (dot) dot.className = 'sync-dot';
    if (txt) txt.innerText = 'Stock: offline (local only)';
  }
}

// ─── FIX: Load Cloud Stock with timestamp conflict resolution ───
async function loadCloudStockData() {
  let cloudData = null;
  let cloudTime = 0;
  try {
    const data = await apiGet('loadStockData');
    if (data.status === 'success' && data.monthlyStock && Object.keys(data.monthlyStock).length > 0) {
      cloudData = data.monthlyStock;
      cloudTime = data.monthlyStock._lastModified || 0;
    }
  } catch (err) {
    console.warn('Cloud stock load failed:', err);
  }

  let localData = null;
  let localTime = 0;
  try {
    const raw = localStorage.getItem('ghanaPostStockBackup');
    if (raw) {
      localData = JSON.parse(raw);
      localTime = localData._lastModified || 0;
    }
  } catch (e) {}

  let useData = null;
  if (cloudData && localData) {
    useData = (localTime > cloudTime) ? localData : cloudData;
  } else if (cloudData) {
    useData = cloudData;
  } else if (localData) {
    useData = localData;
  }

  if (useData) {
    STATE.monthlyStock = {};
    for (const key of Object.keys(useData)) {
      if (key === '_lastModified') continue;
      STATE.monthlyStock[key] = JSON.parse(JSON.stringify(useData[key]));
    }
    STATE.monthlyStock._lastModified = useData._lastModified || Date.now();
    for (let m of MONTHS) {
      const st = STATE.monthlyStock[m];
      if (st?.openingEms) {
        for (let i = 0; i < 5; i++) {
          st.closingEms[i] = (st.openingEms[i] || 0) + (st.receivedEms[i] || 0) - (st.distributedEms[i] || 0);
          st.closingPar[i] = (st.openingPar[i] || 0) + (st.receivedPar[i] || 0) - (st.distributedPar[i] || 0);
        }
      }
    }
    const dot = document.getElementById('stockSyncDot');
    const txt = document.getElementById('stockSyncTxt');
    if (dot) dot.className = 'sync-dot live';
    if (txt) txt.innerText = (useData === localData) ? 'Stock: loaded from browser backup' : 'Stock: live from cloud';
  }

  let hasMovements = false;
  for (let m of MONTHS) {
    if (STATE.monthlyStock[m]?.movements?.length > 0) { hasMovements = true; break; }
  }

  // BUG FIX 1: Never reset _gpoImportAttempted on failure.
  // Resetting it caused an infinite re-import loop every poll cycle (visible in console screenshot).
  if (!hasMovements && !_gpoImportAttempted && typeof window.importGPOReceipts === 'function') {
    _gpoImportAttempted = true;
    // Persist so new sessions/tabs don't re-run auto-import and double-count stock
    try { localStorage.setItem('_gpoImportAttempted', 'true'); } catch(e) {}
    console.log('No movements found – auto‑importing from GPO_Receipts...');
    try {
      await window.importGPOReceipts();
    } catch (e) {
      console.warn('Auto‑import failed (will not retry automatically):', e);
      // DO NOT reset _gpoImportAttempted here – that caused the fetch loop
    }
  }
}

// ─── FIX: loadCloudLedger — cloud is authoritative; seed() only fills gaps
// Months returned by the cloud are recorded in _cloudLoadedMonths so seed()
// won't overwrite them with hardcoded Excel values on page reload.
async function loadCloudLedger() {
  try {
    const data = await apiGet('load');
    console.log('🔵 loadCloudLedger: rows returned =', data.ledger ? data.ledger.length : 0);
    if (data.status === 'success' && data.ledger && data.ledger.length > 0) {
      for (let i = 0; i < data.ledger.length; i++) {
        const row = data.ledger[i];
        // Decode any URL-encoding: Apps Script sometimes returns "May+2026" instead of "May 2026"
        const month = String(row[0] || '').replace(/\+/g, ' ').trim();
        const bid = String(row[1] || '').replace(/\+/g, ' ').trim();
        if (!month || !bid || !BRANCHES.find(b => b.id === bid)) continue;
        _cloudLoadedMonths.add(month);
        if (!STATE.ledger[month]) STATE.ledger[month] = {};
        STATE.ledger[month][bid] = {
          openingBalance: parseFloat(row[4]) || 0,
          payments: parseFloat(row[15]) || 0,
          box1_ems: parseInt(row[5]) || 0,
          box1_parcel: parseInt(row[6]) || 0,
          box2_ems: parseInt(row[7]) || 0,
          box2_parcel: parseInt(row[8]) || 0,
          box3_ems: parseInt(row[9]) || 0,
          box3_parcel: parseInt(row[10]) || 0,
          box4_ems: parseInt(row[11]) || 0,
          box4_parcel: parseInt(row[12]) || 0,
          box5_ems: parseInt(row[13]) || 0,
          box5_parcel: parseInt(row[14]) || 0,
          totalSuppliesAmount: 0,
          totalSuppliesQty: 0,
          generalTotalAmount: 0,
          closingBalance: 0
        };
        // Debug: log May 2026 Kaneshie specifically
        if (String(month).includes('May') && String(bid).includes('W23')) {
          console.log('✅ May 2026 W23 RAW ROW from sheet:', JSON.stringify(row));
          console.log('✅ month value exact:', JSON.stringify(month), 'bid exact:', JSON.stringify(bid));
          console.log('✅ May 2026 W23 loaded from cloud:', JSON.stringify(STATE.ledger[month][bid]));
        }
      }
      console.log('🔵 _cloudLoadedMonths after load:', [..._cloudLoadedMonths].join(', '));
      seed();
      console.log('🔵 After seed(), May 2026 W23:', JSON.stringify(STATE.ledger['May 2026']?.['W23']));
      recalcAll();
      console.log('🔵 After recalcAll(), May 2026 W23:', JSON.stringify(STATE.ledger['May 2026']?.['W23']));
    } else {
      console.warn('🟡 loadCloudLedger: no data returned, falling back to seed');
      seed();
      recalcAll();
    }
  } catch (err) {
    console.error('🔴 loadCloudLedger failed:', err);
    toast('Using local ledger data', 'warn');
    seed();
    recalcAll();
  }
}

function applyNov2025StockCorrection() {
  const FLAG = 'ghanaPostNov2025StockCorrectionApplied_v1';
  if (localStorage.getItem(FLAG) === 'true') return;
  const month = 'November 2025';
  if (!STATE.monthlyStock[month]) {
    STATE.monthlyStock[month] = {
      openingEms:[0,0,0,0,0], openingPar:[0,0,0,0,0],
      receivedEms:[0,0,0,0,0], receivedPar:[0,0,0,0,0],
      distributedEms:[0,0,0,0,0], distributedPar:[0,0,0,0,0],
      closingEms:[0,0,0,0,0], closingPar:[0,0,0,0,0],
      movements: []
    };
  }
  const st = STATE.monthlyStock[month];
  if (!st.receivedEms) st.receivedEms = [0,0,0,0,0];
  if (!st.receivedPar) st.receivedPar = [0,0,0,0,0];
  st.receivedEms[1] = 270;
  st.receivedPar[1] = 330;
  st.receivedEms[2] = 270;
  st.receivedPar[2] = 330;
  const idx = MONTHS.indexOf(month);
  for (let k = idx; k < MONTHS.length - 1; k++) {
    const thisM = MONTHS[k];
    const nextM = MONTHS[k+1];
    if (!STATE.monthlyStock[nextM]) {
      STATE.monthlyStock[nextM] = {
        openingEms:[0,0,0,0,0], openingPar:[0,0,0,0,0],
        receivedEms:[0,0,0,0,0], receivedPar:[0,0,0,0,0],
        distributedEms:[0,0,0,0,0], distributedPar:[0,0,0,0,0],
        closingEms:[0,0,0,0,0], closingPar:[0,0,0,0,0],
        movements: []
      };
    }
    const thisSt = STATE.monthlyStock[thisM];
    const {distEms, distPar} = getLedgerDistributed(thisM);
    const tOp = getDerivedOpening(thisM);
    const nCE = tOp.openingEms.map((v,i)=> v + (thisSt.receivedEms[i]||0) - distEms[i]);
    const nCP = tOp.openingPar.map((v,i)=> v + (thisSt.receivedPar[i]||0) - distPar[i]);
    STATE.monthlyStock[thisM].closingEms = nCE;
    STATE.monthlyStock[thisM].closingPar = nCP;
    STATE.monthlyStock[nextM].openingEms = [...nCE];
    STATE.monthlyStock[nextM].openingPar = [...nCP];
  }
  STATE.monthlyStock._lastModified = Date.now();
  try { localStorage.setItem('ghanaPostStockBackup', JSON.stringify(STATE.monthlyStock)); } catch(e) {}
  localStorage.setItem(FLAG, 'true');
  console.log('Applied Nov 2025 stock correction (14x5x9 & 14x11x12 received adjustment).');
}

function getDerivedOpening(targetMonth){
  const idx = MONTHS.indexOf(targetMonth);
  if(idx <= 0) return {openingEms:[0,0,0,0,0], openingPar:[0,0,0,0,0]};
  const prevMonth = MONTHS[idx-1];
  const prev = STATE.monthlyStock[prevMonth]||{};
  const {distEms: dE2, distPar: dP2} = getLedgerDistributed(prevMonth);
  const prevDistEms = dE2;
  const prevDistPar = dP2;
  const prevOpen = getDerivedOpening(prevMonth);
  const prevRecvEms = prev.receivedEms||[0,0,0,0,0];
  const prevRecvPar = prev.receivedPar||[0,0,0,0,0];
  return {
    openingEms: prevOpen.openingEms.map((v,i)=> v + prevRecvEms[i] - prevDistEms[i]),
    openingPar: prevOpen.openingPar.map((v,i)=> v + prevRecvPar[i] - prevDistPar[i])
  };
}

async function loadAllCloud(){await Promise.all([loadCloudLedger(),loadCloudRequests(),loadCloudAnnouncements(),loadCloudNotifications(),loadCloudStockData()]); applyNov2025StockCorrection(); updateSyncStatus(true, 'Live from Google Sheets'); }
function updateSyncStatus(success, msg) { const dot=document.getElementById('syncDot'); const txt=document.getElementById('syncTxt'); if(!dot||!txt) return; if(success){ dot.className='sync-dot live'; txt.innerText=msg||'Live from Google Sheets'; } else { dot.className='sync-dot'; txt.innerText=msg||'Not synced'; } }
function broadcastUpdate() { localStorage.setItem('ghanaPostSync_'+Math.random(), Date.now().toString()); }
function setupCrossTabSync() {
  window.addEventListener('storage', (e) => {
    if (e.key && e.key.startsWith('ghanaPostSync_')) {
      // Don't overwrite our own in-progress save with another tab's broadcast
      if (_isSaving) return;
      loadAllCloud().then(() => { refreshActivePage(false); toast('🔄 Live update from another dashboard', 'ok'); });
    }
  });
}
async function masterSync(msg, keep){
  _isSaving = true;
  try{
    await Promise.all([cloudSaveLedger(), cloudSaveStockData()]);
    broadcastUpdate();
    refreshActivePage(keep);
    if(msg) toast(msg);
  }catch(e){
    console.error("Sync error",e);
    toast("Sync failed: "+e.message,'err');
  } finally {
    _isSaving = false;
  }
}

function refreshActivePage(keep){
  let btn = document.querySelector('.nav-btn.active');
  let tab = null;
  if (btn) {
    tab = btn.dataset.tab;
    _lastActiveTab = tab;
  } else {
    tab = _lastActiveTab;
    if (!tab) tab = 'dashboard';
  }
  if (tab === 'dashboard') renderDashboard();
  else if (tab === 'analytics') renderAnalytics();
  else if (tab === 'auditLog') renderAuditLog();
  else if (tab === 'manageReqs') renderManageReqs();
  else if (tab === 'supplyUpdate') renderSupplyUpdate(keep);
  else if (tab === 'request') renderRequestForm();
  else if (tab === 'announcements') renderAnnouncementsPage();
  else if (tab === 'notifications') renderNotificationsPage();
  else if (tab === 'migration') renderMigrationPage();
  else if (tab === 'stockMgmt') renderStockManagement();
  else if (tab === 'stockReports') renderStockReports();
  else if (tab === 'customerFeedback') renderCustomerFeedback();
  else if (tab === 'stockDeductionReport') renderStockDeductionReport();
  else renderDashboard();
}

function startPolling(){
  if(_pollTimer) clearInterval(_pollTimer);
  _pollTimer = setInterval(async()=>{
    // BUG FIX C: If a save is currently in progress, skip this poll cycle entirely.
    // Without this, the poll could load stale cloud data and overwrite the updated
    // STATE.ledger before the save completes, causing data to revert on the next refresh.
    if(_isSaving) return;
    const btn = document.querySelector('.nav-btn.active');
    const tab = btn ? btn.dataset.tab : _lastActiveTab;
    if(tab === 'supplyUpdate' || tab === 'stockMgmt' || tab === 'request' || tab === 'manageReqs') {
      return;
    }
    try{
      await Promise.all([loadCloudLedger(), loadCloudRequests(), loadCloudAnnouncements(), loadCloudNotifications(), loadCloudStockData()]);
      // NOTE: recalcAll() is already called inside loadCloudLedger() — calling it
      // again here would overwrite cloud-loaded opening balances with chained values.
      updateNotifBadge();
      refreshActivePage(false);
    } catch(e){}
  }, 18000);
}

function getUnreadCount(){const role=STATE.user.role;if(role==='EMS Coordinator') return STATE.requests.filter(r=>r.status==='pending').length;if(role==='District Head') return STATE.notifications.filter(n=>(n.type==='request'||n.type==='fulfilled')&&!STATE._dismissedNotif.has(String(n.id))).length;if(role==='Post Master') return STATE.notifications.filter(n=>n.branchId===STATE.user.branchId&&!STATE._dismissedNotif.has(String(n.id))).length;return 0;}
function updateNotifBadge(){const b=$('notifBadge');if(!b)return;const c=getUnreadCount();b.textContent=c;b.style.display=c>0?'block':'none';}
function _setLoadStep(idx, msg) {
  const sub = document.getElementById('loadSubTxt');
  if (sub) sub.innerText = msg;
  for (let i = 0; i < 4; i++) {
    const el = document.getElementById('lstep' + i);
    if (!el) continue;
    if (i < idx) { el.className = 'load-step done'; }
    else if (i === idx) { el.className = 'load-step active'; }
    else { el.className = 'load-step'; }
  }
}
function doLogin(){
  const role=$('loginRole').value;
  const pass=$('loginPw').value;
  if(!role){toast('Select a role','warn');return;}
  if(PW[role]!==pass){toast('Incorrect password','err');return;}
  let district=null,branchId=null;
  if(role==='District Head'){const ds=$('distSel');if(!ds||!ds.value){toast('Select district','warn');return;}district=ds.value;}
  else if(role==='Post Master'){const bs=$('branchSel');if(!bs||!bs.value){toast('Select branch','warn');return;}branchId=bs.value;}
  STATE.user={role,id:'user',district,branchId};
  $('uRole').innerText=role;
  $('uLoc').innerText=role==='Post Master'?BRANCHES.find(b=>b.id===branchId)?.name||'':role==='District Head'?district:'Full Region Access';
  const ov=$('loading-overlay');
  ov.classList.remove('hidden');
  $('login-view').style.display='none';
  (async()=>{
    _setLoadStep(0,'Connecting to Google Sheets…');
    await new Promise(r=>setTimeout(r,400));
    _setLoadStep(1,'Loading ledger data…');
    await Promise.all([loadCloudLedger(),loadCloudRequests(),loadCloudAnnouncements(),loadCloudNotifications()]);
    _setLoadStep(2,'Restoring stock records…');
    await loadCloudStockData();
    updateSyncStatus(true,'Live from Google Sheets');
    _setLoadStep(3,'Building your dashboard…');
    await new Promise(r=>setTimeout(r,350));
    buildNav();
    for(let i=0;i<4;i++){const el=document.getElementById('lstep'+i);if(el)el.className='load-step done';}
    const sub=document.getElementById('loadSubTxt');
    if(sub){sub.innerText='Welcome, '+role+'!';sub.style.opacity='1';}
    await new Promise(r=>setTimeout(r,500));
    ov.classList.add('hidden');
    $('app-view').classList.remove('hidden');
    startPolling();
    setupCrossTabSync();
  })();
}

function renderTableHeader(){
  return `<thead>
    <tr>

      <th rowspan="2">Opening (GHS)</th>

function renderBranchRow(b,m){
  const r = STATE.ledger[m]?.[b.id] || blank();
  const bc = BOXES.map(bk => {
    const e = r[bk+'_ems']||0;
    const p = r[bk+'_parcel']||0;
    const v = (e+p)*RATES[bk];
    return `<td>${e}</td><td>${p}</td><td>${fmt(v)}</td>`;
  }).join('');
  return `<tr>
    <td class="tl" data-label="Branch">${b.name}</td>
    <td data-label="Opening (GHS)">${fmt(r.openingBalance)}</td>
    ${bc}
    <td data-label="Supply Val."><strong>${fmt(r.totalSuppliesAmount)}</strong></td>
    <td data-label="Gen. Total">${fmt(r.generalTotalAmount)}</td>
    <td style="color:#059669" data-label="Payments">${fmt(r.payments)}</td>
    <td class="${r.closingBalance>=0?'pos':'neg'}" data-label="Closing">${fmt(r.closingBalance)}</td>
    </tr>`;
}
function renderTotRow(branches,m,label,cls='tot-row'){
  let oS=0,sS=0,gS=0,pS=0,cS=0;
  let eT=[0,0,0,0,0],pT=[0,0,0,0,0],vT=[0,0,0,0,0];
  branches.forEach(b=>{
    const r=STATE.ledger[m]?.[b.id]||blank();
    oS+=r.openingBalance;
    sS+=r.totalSuppliesAmount;
    gS+=r.generalTotalAmount;
    pS+=r.payments;
    cS+=r.closingBalance;
    BOXES.forEach((bk,i)=>{
      eT[i]+=r[bk+'_ems']||0;
      pT[i]+=r[bk+'_parcel']||0;
      vT[i]+=((r[bk+'_ems']||0)+(r[bk+'_parcel']||0))*RATES[bk];
    });
  });
  const bc = BOXES.map((_,i)=>`<td>${eT[i]}</td><td>${pT[i]}</td><td>${fmt(vT[i])}</td>`).join('');
  return `<tr class="${cls}">
    <td class="tl">${label}</td>
    <td>${fmt(oS)}</td>
    ${bc}
    <td><strong>${fmt(sS)}</strong></td>
    <td>${fmt(gS)}</td>
    <td style="color:#059669">${fmt(pS)}</td>
    <td class="${cS>=0?'pos':'neg'}">${fmt(cS)}</td>
    </tr>`;
}

vas id="ch5" height="180"></canvas></div></div><div class="card no-print" id="anaTable" style="overflow-x:auto"></div>`;

function _getAnalyticsRange() { const from = _analyticsState.fromMonth || MONTHS[0]; const to = _analyticsState.toMonth || STATE.month; const fi = MONTHS.indexOf(from); const ti = MONTHS.indexOf(to); if (fi < 0 || ti < 0 || fi > ti) return MONTHS.slice(0, 1); return MONTHS.slice(fi, ti + 1); }
function _rebuildAnalyticsCharts() {

    const el = document.getElementById(id);

  });
  const vis = visibleBranches(); const range = _getAnalyticsRange(); const infoEl = document.getElementById('anaRangeInfo'); if(infoEl) infoEl.innerText = `Showing ${range.length} month${range.length!==1?'s':''}: ${range[0]} → ${range[range.length-1]}`; const mData = range.map(m => { const t = distTotals(vis, m); return { m, sv:t.sv, py:t.py, cb:t.cb, qty:t.qty }; }); const labels = range.map(m => m.replace(' 2025','').replace(' 2026','')); if(document.getElementById('ch1')) { _charts.c1 = new Chart(document.getElementById('ch1'), { type:'bar', data:{ labels, datasets:[ { label:'Supply Value', data:mData.map(d=>d.sv), backgroundColor:'rgba(0,74,173,.7)', borderRadius:5 }, { label:'Payments', data:mData.map(d=>d.py), backgroundColor:'rgba(244,140,6,.7)', borderRadius:5 } ] }, options:{ responsive:true, plugins:{ legend:{position:'top'} }, scales:{ y:{ ticks:{ callback: v=>'GHS '+v.toLocaleString() } } } } }); } if(document.getElementById('ch2')) { _charts.c2 = new Chart(document.getElementById('ch2'), { type:'line', data:{ labels, datasets:[{ label:'Net Closing Balance', data:mData.map(d=>d.cb), borderColor:'#10b981', backgroundColor:'rgba(16,185,129,.1)', fill:true, tension:.35, pointRadius:4 }] }, options:{ responsive:true, plugins:{ legend:{position:'top'} }, scales:{ y:{ ticks:{ callback: v=>'GHS '+v.toLocaleString() } } } } }); } const focusM = _analyticsState.focusMonth || STATE.month; const ranked = [...vis].map(b => { const r = STATE.ledger[focusM]?.[b.id] || blank(); return { name:b.name, cb:r.closingBalance, sv:r.totalSuppliesAmount, py:r.payments }; }).sort((a,b) => b.cb - a.cb); const ch3Title = document.getElementById('ch3Title'); if(ch3Title) ch3Title.textContent = `🏅 Top 10 Branches · Closing Balance (${focusM})`; const top10 = ranked.slice(0,10); if(document.getElementById('ch3')) { _charts.c3 = new Chart(document.getElementById('ch3'), { type:'bar', data:{ labels: top10.map(b => b.name.length>14 ? b.name.slice(0,14)+'…' : b.name), datasets:[{ label:'Closing Balance', data: top10.map(b=>b.cb), backgroundColor: top10.map(b=>b.cb>=0?'rgba(16,185,129,.75)':'rgba(220,38,38,.75)'), borderRadius:4 }] }, options:{ indexAxis:'y', responsive:true, plugins:{ legend:{display:false} }, scales:{ x:{ ticks:{ callback: v=>'GHS '+v.toLocaleString() } } } } }); } const ch4Title = document.getElementById('ch4Title'); if(ch4Title) ch4Title.textContent = `📦 Box Type Distribution (${range[0]}–${range[range.length-1]})`; const boxQtys = BOXES.map(bk => { let q = 0; range.forEach(m => { vis.forEach(b => { const r = STATE.ledger[m]?.[b.id] || blank(); q += (r[bk+'_ems']||0) + (r[bk+'_parcel']||0); }); }); return q; }); if(document.getElementById('ch4')) { _charts.c4 = new Chart(document.getElementById('ch4'), { type:'doughnut', data:{ labels: BOXES.map(b => BOX_LABELS[b]), datasets:[{ data:boxQtys, backgroundColor:['#004aad','#1e40af','#f48c06','#10b981','#7c3aed'], borderWidth:2 }] }, options:{ responsive:true, plugins:{ legend:{position:'right'} } } }); } const distColors = { 'ACCRA CENTRAL':'rgba(0,74,173,.8)', 'ACCRA NORTH':'rgba(244,140,6,.8)', 'ACCRA WEST':'rgba(16,185,129,.8)' }; const distDatasets = DISTRICTS.map(dist => { const distBranches = vis.filter(b => b.district === dist); return { label: dist, data: range.map(m => distBranches.reduce((sum,b)=> sum + (STATE.ledger[m]?.[b.id]||blank()).totalSuppliesAmount, 0)), backgroundColor: distColors[dist] || 'rgba(124,58,237,.8)', borderRadius: 3 }; }); if(document.getElementById('ch5')) { _charts.c5 = new Chart(document.getElementById('ch5'), { type:'bar', data:{ labels, datasets: distDatasets }, options:{ responsive:true, plugins:{ legend:{position:'top'} }, scales:{ x:{ stacked: false }, y:{ stacked: false, ticks:{ callback: v=>'GHS '+v.toLocaleString() } } } } }); } const tableEl = document.getElementById('anaTable'); if(tableEl) { let tHtml = `<div style="font-weight:700;font-size:.85rem;margin-bottom:10px">📋 Monthly Summary Table</div><table style="min-width:600px"><thead><tr><th class="tl">Month</th><th>Supply Value</th><th>Payments</th><th>Collection %</th><th>Net Closing</th><th>Boxes Issued</th><th>Active Branches</th><tr></thead><tbody>`; range.forEach(m => { const d = mData.find(x=>x.m===m) || {sv:0,py:0,cb:0,qty:0}; const pct = d.sv>0 ? (d.py/d.sv*100).toFixed(1) : '0.0'; const active = vis.filter(b=>(STATE.ledger[m]?.[b.id]||blank()).totalSuppliesQty>0).length; tHtml += `<tr><td class="tl">${m}</td><td>${fmt(d.sv)}</td><td>${fmt(d.py)}</td><td><span style="color:${parseFloat(pct)>=80?'#15803d':parseFloat(pct)>=50?'#b45309':'#b91c1c'};font-weight:700">${pct}%</span></td><td class="${d.cb>=0?'pos':'neg'}">${fmt(d.cb)}</td><td>${d.qty.toLocaleString()}</td><td>${active}/${vis.length}</td>`; }); const totSv = mData.reduce((s,d)=>s+d.sv,0); const totPy = mData.reduce((s,d)=>s+d.py,0); const totCb = mData.reduce((s,d)=>s+d.cb,0); const totQty = mData.reduce((s,d)=>s+d.qty,0); const totPct = totSv>0 ? (totPy/totSv*100).toFixed(1) : '0.0'; tHtml += `<tr class="gtot-row"><td class="tl">RANGE TOTAL (${range.length} months)</td><td>${fmt(totSv)}</td><td>${fmt(totPy)}</td><td>${totPct}%</span></td><td class="${totCb>=0?'pos':'neg'}">${fmt(totCb)}</td><td>${totQty.toLocaleString()}</td><td>—</td></tr></tbody></table>`; tableEl.innerHTML = tHtml; } _buildAnalyticsInsight(mData, ranked, vis, range); }
function _buildAnalyticsInsight(mData, ranked, vis, range) { const el = document.getElementById('aiInsight'); if (!el) return; const totalSv = mData.reduce((s,d)=>s+d.sv,0); const totalPy = mData.reduce((s,d)=>s+d.py,0); const totalCb = mData.reduce((s,d)=>s+d.cb,0); const payRate = totalSv>0 ? (totalPy/totalSv*100).toFixed(1) : '0'; const half = Math.floor(mData.length/2); const firstHalfSv = mData.slice(0,half||1).reduce((s,d)=>s+d.sv,0); const secondHalfSv = mData.slice(half).reduce((s,d)=>s+d.sv,0); const svTrendWord = secondHalfSv > firstHalfSv ? '📈 rising' : secondHalfSv < firstHalfSv ? '📉 falling' : '➡️ stable'; const bestMonth = [...mData].sort((a,b)=>b.sv-a.sv)[0]; const worstMonth = [...mData].sort((a,b)=>a.cb-b.cb)[0]; const distSummary = DISTRICTS.map(dist => { const dBranches = vis.filter(b=>b.district===dist); let sv=0, py=0; range.forEach(m => dBranches.forEach(b => { const r = STATE.ledger[m]?.[b.id]||blank(); sv += r.totalSuppliesAmount; py += r.payments; })); const eff = sv>0 ? (py/sv*100).toFixed(1) : '0'; return { dist, sv, py, eff }; }).sort((a,b)=>b.sv-a.sv); const persistentDeficit = vis.filter(b => { const negCount = range.filter(m => (STATE.ledger[m]?.[b.id]||blank()).closingBalance < 0).length; return negCount > range.length * 0.5; }); const improved = vis.filter(b => { const first = (STATE.ledger[range[0]]?.[b.id]||blank()).closingBalance; const last = (STATE.ledger[range[range.length-1]]?.[b.id]||blank()).closingBalance; return last > first && first !== last; }).sort((a,b)=>{ const ia = (STATE.ledger[range[range.length-1]]?.[a.id]||blank()).closingBalance - (STATE.ledger[range[0]]?.[a.id]||blank()).closingBalance; const ib = (STATE.ledger[range[range.length-1]]?.[b.id]||blank()).closingBalance - (STATE.ledger[range[0]]?.[b.id]||blank()).closingBalance; return ib - ia; }); el.innerHTML = `<div class="ai-icon">📊 Multi-Month Analytics Insight <span style="font-size:.72rem;font-weight:500;opacity:.75;margin-left:8px">${range[0]} → ${range[range.length-1]} (${range.length} months)</span></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:10px 0"><div style="background:rgba(0,74,173,.08);border-radius:10px;padding:10px"><div style="font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#1e40af;margin-bottom:4px">📦 Total Supply Value</div><div style="font-size:1.1rem;font-weight:800;color:#1e3a5f">${fmt(totalSv)}</div><div style="font-size:.72rem;color:#475569;margin-top:2px">Trend: <strong>${svTrendWord}</strong></div></div><div style="background:rgba(244,140,6,.08);border-radius:10px;padding:10px"><div style="font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#b45309;margin-bottom:4px">💰 Total Payments</div><div style="font-size:1.1rem;font-weight:800;color:#1e3a5f">${fmt(totalPy)}</div><div style="font-size:.72rem;color:#475569;margin-top:2px">Collection rate: <strong>${payRate}%</strong></div></div><div style="background:rgba(16,185,129,.08);border-radius:10px;padding:10px"><div style="font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#065f46;margin-bottom:4px">📈 Best Supply Month</div><div style="font-size:1rem;font-weight:800;color:#1e3a5f">${bestMonth?.m||'—'}</div><div style="font-size:.72rem;color:#475569;margin-top:2px">${fmt(bestMonth?.sv||0)} supplied</div></div><div style="background:rgba(220,38,38,.07);border-radius:10px;padding:10px"><div style="font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#991b1b;margin-bottom:4px">⚠️ Worst Closing Month</div><div style="font-size:1rem;font-weight:800;color:#1e3a5f">${worstMonth?.m||'—'}</div><div style="font-size:.72rem;color:#475569;margin-top:2px">Net balance: ${fmt(worstMonth?.cb||0)}</div></div></div><p style="font-size:.82rem;color:#1e3a5f;margin:8px 0 4px"><strong>🏛️ District Performance (${range.length}-month cumulative):</strong></p><div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px">${distSummary.map(d=>`<div style="background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px;padding:7px 12px;font-size:.78rem"><strong>${d.dist}</strong><br>Supply: ${fmt(d.sv)} &nbsp;·&nbsp; Payments: ${fmt(d.py)}<br>Efficiency: <span style="color:${parseFloat(d.eff)>=80?'#15803d':parseFloat(d.eff)>=50?'#b45309':'#b91c1c'};font-weight:700">${d.eff}%</span></div>`).join('')}</div>${persistentDeficit.length ? `<p style="font-size:.82rem;color:#991b1b;margin:6px 0"><strong>🔴 Persistent Deficit Branches</strong> (negative closing in over half the selected months): ${persistentDeficit.map(b=>`<em>${b.name}</em>`).join(', ')}</p>` : `<p style="font-size:.82rem;color:#15803d;margin:6px 0">✅ No branch was in persistent deficit across the selected range.</p>`}${improved.length ? `<p style="font-size:.82rem;color:#1e3a5f;margin:6px 0"><strong>📈 Most Improved Branches</strong> (${range[0]} → ${range[range.length-1]}): ${improved.slice(0,3).map(b=>`<em>${b.name}</em>`).join(', ')}${improved.length>3?` and ${improved.length-3} more`:''}</p>` : ''}<p style="font-size:.78rem;color:#64748b;margin-top:8px"><strong>💡 Recommendation:</strong> ${parseFloat(payRate)<60 ? `Collection efficiency is below 60% — escalate follow-up on outstanding balances, especially in ${distSummary[distSummary.length-1]?.dist}.` : parseFloat(payRate)<80 ? `Good progress — push to close the ${(100-parseFloat(payRate)).toFixed(1)}% gap by month-end reconciliation with deficit branches.` : `Excellent collection rate. Maintain momentum and ensure stock is available to meet next-period demand.`}</p>`; }

window.loadBranchForm=function(bid){if(!bid)return;if(!STATE.ledger[STATE.month]) STATE.ledger[STATE.month]={};if(!STATE.ledger[STATE.month][bid]) STATE.ledger[STATE.month][bid]=blank();const r=STATE.ledger[STATE.month][bid];const b=BRANCHES.find(x=>x.id===bid);$('branchFormDiv').innerHTML=`<div style="background:#f8fafc;padding:18px;border-radius:14px"><h4>${b.name} — ${STATE.month}</h4><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:12px 0">${BOXES.map(bk=>`<div style="border:1px solid #ccc;padding:8px;border-radius:8px"><div><strong>${BOX_LABELS[bk]}</strong> @GHS${RATES[bk]}</div><input type="number" id="ems_${bk}" placeholder="EMS" value="${r[bk+'_ems']||0}" min="0" oninput="updateLiveCalc('${bid}')" style="width:100%;margin:4px 0"><input type="number" id="par_${bk}" placeholder="Parcel" value="${r[bk+'_parcel']||0}" min="0" oninput="updateLiveCalc('${bid}')" style="width:100%"><div id="val_${bk}" style="font-size:.7rem;margin-top:4px;color:var(--blue)">Val: ${fmt(((r[bk+'_ems']||0)+(r[bk+'_parcel']||0))*RATES[bk])}</div></div>`).join('')}</div><div style="background:#e0f2fe;padding:10px;border-radius:8px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;font-size:.82rem"><div>Opening: ${fmt(r.openingBalance)}</div><div>Supply Val: <span id="ls_sv">${fmt(r.totalSuppliesAmount)}</span></div><div>Gen.Total: <span id="ls_gt">${fmt(r.generalTotalAmount)}</span></div><div>Closing: <span id="ls_cb" class="${r.closingBalance>=0?'pos':'neg'}">${fmt(r.closingBalance)}</span></div></div><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-danger btn-sm" onclick="resetSupplies('${bid}')">🗑️ Reset</button><button class="btn btn-primary" onclick="saveSupplies('${bid}')">💾 Save Supplies</button></div><hr style="margin:16px 0"><h4>💰 Payment Entry</h4><div style="display:flex;gap:8px;align-items:end;flex-wrap:wrap"><div style="min-width:180px"><label>Payment (GHS)</label><input type="number" id="payAmount" value="${r.payments||0}" step="0.01"></div><button class="btn btn-success" onclick="savePayment('${bid}')">Save Payment</button></div></div>`;};
window.updateLiveCalc=function(bid){const r=STATE.ledger[STATE.month]?.[bid]||blank();let sv=0;BOXES.forEach(bk=>{const e=parseInt($('ems_'+bk)?.value)||0,p=parseInt($('par_'+bk)?.value)||0;const v=(e+p)*RATES[bk];sv+=v;const el=$('val_'+bk);if(el)el.innerText='Val: '+fmt(v);});const gt=(r.openingBalance||0)+sv;const cb=gt-(r.payments||0);const sv_el=$('ls_sv');const gt_el=$('ls_gt');const cb_el=$('ls_cb');if(sv_el)sv_el.innerText=fmt(sv);if(gt_el)gt_el.innerText=fmt(gt);if(cb_el){cb_el.innerText=fmt(cb);cb_el.className=cb>=0?'pos':'neg';}};
// BUG FIX A+C: Added _isSaving lock to prevent the 18-second poll from overwriting
// STATE.ledger while a save is still in flight (was the main cause of lost data on refresh).
// Also fixed distributedEms/Par: these are now SET to the exact ledger totals, not
// accumulated on top of prior values — prevents double-deduction on re-saves.

window.saveSupplies=async function(bid){
  if(STATE.user.role!=='EMS Coordinator'){toast('Not authorized','err');return;}
  if(!STATE.ledger[STATE.month])STATE.ledger[STATE.month]={};
  if(!STATE.ledger[STATE.month][bid])STATE.ledger[STATE.month][bid]=blank();
  const t=STATE.ledger[STATE.month][bid];
  let boxEms=[0,0,0,0,0], boxPar=[0,0,0,0,0];
  BOXES.forEach((bk,idx)=>{
    const e=parseInt($('ems_'+bk)?.value)||0;
    const p=parseInt($('par_'+bk)?.value)||0;
    boxEms[idx]=e; boxPar[idx]=p;
    t[bk+'_ems']=e; t[bk+'_parcel']=p;
  });
  const curMonth=STATE.month;
  if(!STATE.monthlyStock[curMonth]) STATE.monthlyStock[curMonth]={openingEms:[0,0,0,0,0], openingPar:[0,0,0,0,0], receivedEms:[0,0,0,0,0], receivedPar:[0,0,0,0,0], distributedEms:[0,0,0,0,0], distributedPar:[0,0,0,0,0], closingEms:[0,0,0,0,0], closingPar:[0,0,0,0,0], movements:[]};
  const st=STATE.monthlyStock[curMonth];

  // BUG FIX A: Recalculate total distributed from the FULL ledger for this month, not
  // cumulative additions. Previously st.distributedEms[i] += boxEms[i] stacked on every
  // save, doubling/tripling the deduction when the same branch was edited more than once.
  const {distEms: newTotalDistEms, distPar: newTotalDistPar} = getLedgerDistributed(curMonth);
  for(let i=0;i<5;i++){
    st.distributedEms[i] = newTotalDistEms[i];
    st.distributedPar[i] = newTotalDistPar[i];
    st.closingEms[i] = st.openingEms[i] + st.receivedEms[i] - st.distributedEms[i];
    st.closingPar[i] = st.openingPar[i] + st.receivedPar[i] - st.distributedPar[i];
  }
  const idx=MONTHS.indexOf(curMonth);
  if(idx+1<MONTHS.length){
    const nextMonth=MONTHS[idx+1];
    if(!STATE.monthlyStock[nextMonth]) STATE.monthlyStock[nextMonth]={openingEms:[0,0,0,0,0], openingPar:[0,0,0,0,0], receivedEms:[0,0,0,0,0], receivedPar:[0,0,0,0,0], distributedEms:[0,0,0,0,0], distributedPar:[0,0,0,0,0], closingEms:[0,0,0,0,0], closingPar:[0,0,0,0,0], movements:[]};
    STATE.monthlyStock[nextMonth].openingEms=[...st.closingEms];
    STATE.monthlyStock[nextMonth].openingPar=[...st.closingPar];
  }
  recalcAll();
  updateLiveCalc(bid);
  STATE.monthlyStock._lastModified = Date.now();
  try { localStorage.setItem('ghanaPostStockBackup', JSON.stringify(STATE.monthlyStock)); } catch(e) {}
  // BUG FIX C: Set _isSaving=true so the poll timer skips overwriting STATE.ledger mid-save
  _isSaving = true;
  try{
    await Promise.all([cloudSaveLedger(),cloudSaveStockData()]);
    broadcastUpdate();
    toast('✅ Supplies saved. Stock deducted.');
  }catch(e){
    console.error(e);
    toast('Saved locally, cloud sync failed','warn');
  } finally {
    _isSaving = false;
  }
};
window.savePayment=async function(bid){
  if(!STATE.ledger[STATE.month])STATE.ledger[STATE.month]={};
  if(!STATE.ledger[STATE.month][bid])STATE.ledger[STATE.month][bid]=blank();
  STATE.ledger[STATE.month][bid].payments=parseFloat($('payAmount')?.value)||0;
  recalcAll();
  updateLiveCalc(bid);
  _isSaving = true;
  try{
    await Promise.all([cloudSaveLedger(),cloudSaveStockData()]);
    broadcastUpdate();
    toast('✅ Payment saved');
  }catch(e){
    console.error(e);
    toast('Saved locally, cloud sync failed','warn');
  } finally {
    _isSaving = false;
  }
};

function renderManageReqs(){if(STATE.user.role!=='EMS Coordinator'){toast('Access denied','err');return;}const pending=STATE.requests.filter(r=>r.status==='pending');const fulfilled=STATE.requests.filter(r=>r.status==='fulfilled').slice(-15).reverse();let html=`${annContainer()}<div class="page-header"><div class="page-title">✅ Fulfill Requests</div><button class="btn btn-ghost btn-sm" onclick="loadCloudRequests().then(()=>renderManageReqs())">🔄 Refresh</button></div>`;if(!pending.length){html+=`<div class="card" style="text-align:center;padding:28px;color:var(--muted)">🎉 No pending requests at this time.</div>`;}else{html+=`<div class="card"><h3 style="margin-bottom:14px;color:var(--blue)">⏳ Pending Requests (${pending.length})</h3>`;pending.forEach(r=>{const br=BRANCHES.find(b=>b.id===r.branchId);const summary=BOXES.map(bk=>`<strong>${BOX_LABELS[bk]}:</strong> EMS ${r.items?.[bk+'_ems']||0} / Par ${r.items?.[bk+'_parcel']||0}`).join(' &nbsp;|&nbsp; ');html+=`<div class="notif-item request unread"><div class="notif-header"><div style="flex:1"><div class="notif-title">📮 ${esc(r.branchName)} <span class="notif-badge nb-new">NEW REQUEST</span></div><div class="notif-body" style="margin-top:4px">District: ${esc(br?.district||r.district||'')} &nbsp;·&nbsp; Month: ${esc(r.month)}<br><span style="margin-top:4px;display:block">${summary}</span></div><div style="font-size:.7rem;color:var(--muted);margin-top:4px">Submitted: ${fmtDate(r.createdAt)}</div></div><div style="text-align:right;flex-shrink:0"><button class="btn btn-success btn-sm" onclick="fulfillReq(${r.id})">✅ Fulfill & Update Ledger</button></div></div></div>`;});html+=`</div>`;}if(fulfilled.length){html+=`<div class="card"><h3 style="margin-bottom:12px;color:var(--success)">✅ Recently Fulfilled</h3>`;fulfilled.forEach(r=>{html+=`<div class="notif-item fulfilled" style="opacity:.8"><div class="notif-header"><div><div class="notif-title">✅ ${esc(r.branchName)} <span class="notif-badge nb-fulfilled">FULFILLED</span window.fulfillReq = async function(requestId) { const req = STATE.requests.find(r => r.id == requestId); if (!req || req.status !== 'pending') { toast('Request not found or already fulfilled', 'err'); return; } const month = req.month; const branchId = req.branchId; if (!STATE.ledger[month]) STATE.ledger[month] = {}; if (!STATE.ledger[month][branchId]) STATE.ledger[month][branchId] = blank(); const branchLedger = STATE.ledger[month][branchId]; for (let bk of BOXES) { const emsReq = req.items?.[bk + '_ems'] || 0; const parReq = req.items?.[bk + '_parcel'] || 0; branchLedger[bk + '_ems'] = (branchLedger[bk + '_ems'] || 0) + emsReq; branchLedger[bk + '_parcel'] = (branchLedger[bk + '_parcel'] || 0) + parReq; } calcRec(branchLedger); if (!STATE.monthlyStock[month]) { STATE.monthlyStock[month] = { openingEms: [0,0,0,0,0], openingPar: [0,0,0,0,0], receivedEms: [0,0,0,0,0], receivedPar: [0,0,0,0,0], distributedEms: [0,0,0,0,0], distributedPar: [0,0,0,0,0], closingEms: [0,0,0,0,0], closingPar: [0,0,0,0,0], movements: [] }; } const st = STATE.monthlyStock[month]; let insufficient = false; for (let i = 0; i < 5; i++) { const bk = BOXES[i]; const emsReq = req.items?.[bk + '_ems'] || 0; const parReq = req.items?.[bk + '_parcel'] || 0; const availEms = st.openingEms[i] + st.receivedEms[i] - st.distributedEms[i]; const availPar = st.openingPar[i] + st.receivedPar[i] - st.distributedPar[i]; if (emsReq > availEms) { toast(`Insufficient EMS stock for ${BOX_LABELS[bk]}. Available: ${availEms}`, 'err'); insufficient = true; break; } if (parReq > availPar) { toast(`Insufficient Parcel stock for ${BOX_LABELS[bk]}. Available: ${availPar}`, 'err'); insufficient = true; break; } } if (insufficient) return; for (let i = 0; i < 5; i++) { const bk = BOXES[i]; st.distributedEms[i] += (req.items?.[bk + '_ems'] || 0); st.distributedPar[i] += (req.items?.[bk + '_parcel'] || 0); st.closingEms[i] = st.openingEms[i] + st.receivedEms[i] - st.distributedEms[i]; st.closingPar[i] = st.openingPar[i] + st.receivedPar[i] - st.distributedPar[i]; } const idx = MONTHS.indexOf(month); if (idx + 1 < MONTHS.length) { const nextMonth = MONTHS[idx + 1]; if (!STATE.monthlyStock[nextMonth]) { STATE.monthlyStock[nextMonth] = { openingEms: [0,0,0,0,0], openingPar: [0,0,0,0,0], receivedEms: [0,0,0,0,0], receivedPar: [0,0,0,0,0], distributedEms: [0,0,0,0,0], distributedPar: [0,0,0,0,0], closingEms: [0,0,0,0,0], closingPar: [0,0,0,0,0], movements: [] }; } STATE.monthlyStock[nextMonth].openingEms = [...st.closingEms]; STATE.monthlyStock[nextMonth].openingPar = [...st.closingPar]; } req.status = 'fulfilled'; req.fulfilledAt = new Date().toISOString(); req.supplyNoteId = `SN-${req.id}-${Date.now()}`; const ledgerSnapshot = { openingBalance: branchLedger.openingBalance, totalSuppliesAmount: branchLedger.totalSuppliesAmount, payments: branchLedger.payments, closingBalance: branchLedger.closingBalance }; const branch = BRANCHES.find(b => b.id === branchId); const districtHeadNotif = { id: Date.now(), type: 'fulfilled', title: `✅ Supplies Fulfilled – ${branch.name}`, body: `Requested cartons for ${month} have been supplied. Check ledger.`, branchId: branchId, district: branch.district, month: month, ledgerSnapshot: ledgerSnapshot, createdAt: new Date().toISOString() }; const branchNotif = { ...districtHeadNotif, title: `✅ Your request for ${month} has been fulfilled`, branchId: branchId }; STATE.notifications.push(districtHeadNotif, branchNotif); try { await apiPost({ action: 'saveRequest', request: req }); await apiPost({ action: 'saveNotification', notification: districtHeadNotif }); await apiPost({ action: 'saveNotification', notification: branchNotif }); await masterSync(`✅ Request #${requestId} fulfilled.`, null); renderManageReqs(); toast(`Supplies for ${branch.name} fulfilled.`, 'ok'); } catch (err) { console.error(err); toast('Fulfillment saved locally, cloud sync pending', 'warn'); renderManageReqs(); } };

window.runMigration=async function(){ if(!confirm('Push all ledger data to Google Sheets now?')) return; toast('Migration started (chunked upload)...','warn'); const logDiv = document.getElementById('migLog'); const logTxt = document.getElementById('migLogTxt'); if(logDiv) logDiv.classList.remove('hidden'); if(logTxt) logTxt.innerText = 'Preparing data…\n'; try { const allRows = []; for(const month of MONTHS) { for(const branch of BRANCHES) { const r = STATE.ledger[month]?.[branch.id]; if(!r) continue; if(r.totalSuppliesQty===0 && r.openingBalance===0 && r.payments===0) continue; allRows.push([ month, branch.id, branch.name, branch.district, r.openingBalance, r.box1_ems, r.box1_parcel, r.box2_ems, r.box2_parcel, r.box3_ems, r.box3_parcel, r.box4_ems, r.box4_parcel, r.box5_ems, r.box5_parcel, r.payments, r.totalSuppliesAmount, r.generalTotalAmount, r.closingBalance ]); } } const totalRows = allRows.length; if(totalRows === 0) { if(logTxt) logTxt.innerText = 'No data to migrate.'; toast('No data to migrate','warn'); return; } if(logTxt) logTxt.innerText = `Found ${totalRows} records. Splitting into chunks...\n`; const CHUNK_SIZE = 200; const chunks = []; for(let i=0; i<totalRows; i+=CHUNK_SIZE) { chunks.push(allRows.slice(i, i+CHUNK_SIZE)); } let successCount = 0; for(let idx=0; idx<chunks.length; idx++) { const chunk = chunks[idx]; if(logTxt) logTxt.innerText += `Sending chunk ${idx+1}/${chunks.length} (${chunk.length} rows)...\n`; const payload = { action: 'migrateData', rows: chunk, user: 'EMS Coordinator', chunkIndex: idx, totalChunks: chunks.length }; const res = await apiPost(payload); if(res.status === 'success') { successCount += chunk.length; if(logTxt) logTxt.innerText += `✅ Chunk ${idx+1} saved.\n`; } else { throw new Error(`Chunk ${idx+1} failed: ${JSON.stringify(res)}`); } await new Promise(r => setTimeout(r, 500)); } if(logTxt) logTxt.innerText += `\n✅ Migration complete! ${successCount} rows written.\nGoogle Sheets is now the single source of truth.`; toast('✅ All data migrated successfully (chunked upload)'); } catch(e) { console.error(e); if(logTxt) logTxt.innerText += `❌ Error: ${e.message}\nMigration stopped. Please retry.`; toast('Migration failed – check network or Apps Script logs','err'); } };

window.deleteReceipt = async function(month, index) {
  if (!confirm(`Delete this receipt permanently? This will revert all stock quantities.`)) return;
  const st = STATE.monthlyStock[month];
  if (!st || !st.movements[index]) return;
  const receipt = st.movements[index];
  const { emsQtys, parQtys } = receipt;
  for (let i = 0; i < 5; i++) {
    st.receivedEms[i] -= emsQtys[i];
    st.receivedPar[i] -= parQtys[i];
    st.closingEms[i] = st.openingEms[i] + st.receivedEms[i] - st.distributedEms[i];
    st.closingPar[i] = st.openingPar[i] + st.receivedPar[i] - st.distributedPar[i];
  }
  st.movements.splice(index, 1);
  const idx = MONTHS.indexOf(month);
  if (idx + 1 < MONTHS.length) {
    const nextMonth = MONTHS[idx + 1];
    if (!STATE.monthlyStock[nextMonth]) {
      STATE.monthlyStock[nextMonth] = {
        openingEms: [0,0,0,0,0], openingPar: [0,0,0,0,0],
        receivedEms: [0,0,0,0,0], receivedPar: [0,0,0,0,0],
        distributedEms: [0,0,0,0,0], distributedPar: [0,0,0,0,0],
        closingEms: [0,0,0,0,0], closingPar: [0,0,0,0,0],
        movements: []
      };
    }
    STATE.monthlyStock[nextMonth].openingEms = [...st.closingEms];
    STATE.monthlyStock[nextMonth].openingPar = [...st.closingPar];
  }
  STATE.monthlyStock._lastModified = Date.now();
  try { localStorage.setItem('ghanaPostStockBackup', JSON.stringify(STATE.monthlyStock)); } catch(e) {}
  await masterSync(`🗑️ Deleted receipt (Waybill: ${receipt.waybill})`, null);
  const activeTab = document.querySelector('.nav-btn.active')?.dataset.tab;
  if (activeTab === 'stockMgmt') renderStockManagement();
  else if (activeTab === 'stockReports') renderStockReports();
  else if (activeTab === 'stockDeductionReport') renderStockDeductionReport();
};

djustment (per box size)</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0">${BOXES.map((bk,i)=>`<div style="border:1px solid #ccc;padding:6px;border-radius:6px"><strong>${BOX_LABELS[bk]}</strong><hr style="margin:4px 0"><label>Opening EMS</label><input type="number" id="openEms_${i}" value="${st.openingEms[i]}"><label>Opening Par</label><input type="number" id="openPar_${i}" value="${st.openingPar[i]}"><label>Received EMS</label><input type="number" id="recEmsAdj_${i}" value="${st.receivedEms[i]}"><label>Received Par</label><input type="number" id="recParAdj_${i}" value="${st.receivedPar[i]}"><label>Distributed EMS</label><input type="number" id="distEmsAdj_${i}" value="${st.distributedEms[i]}"><label>Distributed Par</label><input type="number" id="distParAdj_${i}" value="${st.distributedPar[i]}"></div>`).join('')}</div><button class="btn btn-primary" onclick="manualStockUpdate()">💾 Update Stock Figures</button><p style="font-size:.7rem;margin-top:8px;color:var(--muted)">Closing = Opening + Received - Distributed. Next month's opening will update automatically.</p></div><div class="card"><h3>📜 Stock Movement History (${curMonth})</h3><div style="overflow-x:auto"><table style="min-width:800px"><thead><tr><th>Date</th><th>Waybill</th>${BOXES.map(bk=>`<th>${BOX_LABELS[bk]}<br>EMS</th><th>${BOX_LABELS[bk]}<br>Par</th>`).join('')}<th>Total Boxes</th><th>Total Value</th><th>Action</th></tr></thead><tbody>${st.movements&&st.movements.length?st.movements.map((m,idx)=>`<tr><td>${fmtDate(m.date)}</td><td>${esc(m.waybill)}</td>${m.emsQtys.map((q,i)=>`<td>${q}</td><td>${m.parQtys[i]}</td>`).join('')}<td>${m.totalBoxes}</td><td>${fmt(m.totalValue)}</td><td><button class="btn btn-danger btn-sm" onclick="deleteReceipt('${curMonth}', ${idx})">🗑️</button></td>`).join(''):`<tr><td colspan="${7+BOXES.length}">No receipts recorded yet.</td></tr>`}</tbody></table></div></div>`; $('mainContent').innerHTML=html; window.changeStoc // ─── FIX: importGPOReceipts – only import if there are actual receipts ───
window.importGPOReceipts = async function() {
  toast('Fetching receipts from GPO sheet...', 'warn');
  try {
    const response = await apiGet('fetchGPOReceipts');
    if (response.status !== 'success' || !response.receipts || response.receipts.length === 0) {
      toast('No receipts found or error fetching data', 'err');
      return;
    }

    // BUG FIX 7: Normalise column name variants from GPO_Receipts sheet.
    // Apps Script may return box1_parcel or box1_par depending on sheet headers.
    // This makes import resilient to both naming conventions.
    const receipts = response.receipts.map(r => ({
      waybill: r.waybill || r.Waybill || r.waybill_no || '',
      date: r.date || r.Date || r.date_received || '',
      box1_ems:   parseInt(r.box1_ems   || r.box1_EMS   || 0) || 0,
      box1_par:   parseInt(r.box1_par   || r.box1_parcel || r.box1_Parcel || 0) || 0,
      box2_ems:   parseInt(r.box2_ems   || r.box2_EMS   || 0) || 0,
      box2_par:   parseInt(r.box2_par   || r.box2_parcel || r.box2_Parcel || 0) || 0,
      box3_ems:   parseInt(r.box3_ems   || r.box3_EMS   || 0) || 0,
      box3_par:   parseInt(r.box3_par   || r.box3_parcel || r.box3_Parcel || 0) || 0,
      box4_ems:   parseInt(r.box4_ems   || r.box4_EMS   || 0) || 0,
      box4_par:   parseInt(r.box4_par   || r.box4_parcel || r.box4_Parcel || 0) || 0,
      box5_ems:   parseInt(r.box5_ems   || r.box5_EMS   || 0) || 0,
      box5_par:   parseInt(r.box5_par   || r.box5_parcel || r.box5_Parcel || 0) || 0,
    }));
    let importedCount = 0;
    let skippedCount = 0;

    // BUG FIX 2: Build a set of waybills already imported so we never double-count on re-import.
    // Without this, every successful poll cycle re-added the same receipts to receivedEms/Par.
    const existingWaybills = new Set();
    for (const m of MONTHS) {
      const movements = STATE.monthlyStock[m]?.movements || [];
      for (const mv of movements) { if (mv.waybill) existingWaybills.add(String(mv.waybill).trim()); }
    }

    for (const receipt of receipts) {
      let receiptDate = new Date(receipt.date);
      if (isNaN(receiptDate.getTime())) {
        skippedCount++;
        continue;
      }
      const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      const monthStr = monthNames[receiptDate.getMonth()] + ' ' + receiptDate.getFullYear();
      if (!MONTHS.includes(monthStr)) {
        skippedCount++;
        continue;
      }

      // BUG FIX 2 (cont): Skip already-imported waybills – prevents figures reverting/doubling each poll
      const waybillKey = String(receipt.waybill || '').trim();
      if (waybillKey && existingWaybills.has(waybillKey)) {
        skippedCount++;
        continue;
      }

      if (!STATE.monthlyStock[monthStr]) {
        STATE.monthlyStock[monthStr] = {
          openingEms: [0,0,0,0,0], openingPar: [0,0,0,0,0],
          receivedEms: [0,0,0,0,0], receivedPar: [0,0,0,0,0],
          distributedEms: [0,0,0,0,0], distributedPar: [0,0,0,0,0],
          closingEms: [0,0,0,0,0], closingPar: [0,0,0,0,0],
          movements: []
        };
      }
      const st = STATE.monthlyStock[monthStr];

      const emsQtys = [
        parseInt(receipt.box1_ems)||0, parseInt(receipt.box2_ems)||0,
        parseInt(receipt.box3_ems)||0, parseInt(receipt.box4_ems)||0,
        parseInt(receipt.box5_ems)||0
      ];
      const parQtys = [
        parseInt(receipt.box1_par)||0, parseInt(receipt.box2_par)||0,
        parseInt(receipt.box3_par)||0, parseInt(receipt.box4_par)||0,
        parseInt(receipt.box5_par)||0
      ];

      if (emsQtys.every(q => q === 0) && parQtys.every(q => q === 0)) {
        skippedCount++;
        continue;
      }

      let totalBoxes = 0, totalValue = 0;
      for (let i = 0; i < 5; i++) {
        totalBoxes += emsQtys[i] + parQtys[i];
        totalValue += (emsQtys[i] + parQtys[i]) * RATES[`box${i+1}`];
        st.receivedEms[i] += emsQtys[i];
        st.receivedPar[i] += parQtys[i];
        st.closingEms[i] = st.openingEms[i] + st.receivedEms[i] - st.distributedEms[i];
        st.closingPar[i] = st.openingPar[i] + st.receivedPar[i] - st.distributedPar[i];
      }

      st.movements.push({
        waybill: receipt.waybill,
        date: receipt.date,
        emsQtys: [...emsQtys],
        parQtys: [...parQtys],
        totalBoxes: totalBoxes,
        totalValue: totalValue
      });

      const idx = MONTHS.indexOf(monthStr);
      for(let k = idx; k < MONTHS.length - 1; k++){
        const thisM = MONTHS[k];
        const nextM = MONTHS[k+1];
        if(!STATE.monthlyStock[nextM]){
          STATE.monthlyStock[nextM] = {
            openingEms: [0,0,0,0,0], openingPar: [0,0,0,0,0],
            receivedEms: [0,0,0,0,0], receivedPar: [0,0,0,0,0],
            distributedEms: [0,0,0,0,0], distributedPar: [0,0,0,0,0],
            closingEms: [0,0,0,0,0], closingPar: [0,0,0,0,0],
            movements: []
          };
        }
        const thisSt = STATE.monthlyStock[thisM];
        const {distEms: dEg, distPar: dPg} = getLedgerDistributed(thisM);
        const gDE = dEg;
        const gDP = dPg;
        const gOp = getDerivedOpening(thisM);
        const nCE = gOp.openingEms.map((v,i)=> v + (thisSt.receivedEms[i]||0) - gDE[i]);
        const nCP = gOp.openingPar.map((v,i)=> v + (thisSt.receivedPar[i]||0) - gDP[i]);
        STATE.monthlyStock[thisM].closingEms = nCE;
        STATE.monthlyStock[thisM].closingPar = nCP;
        STATE.monthlyStock[nextM].openingEms = [...nCE];
        STATE.monthlyStock[nextM].openingPar = [...nCP];
      }
      importedCount++;
    }

    STATE.monthlyStock._lastModified = Date.now();
    try { localStorage.setItem('ghanaPostStockBackup', JSON.stringify(STATE.monthlyStock)); } catch(e) {}
    await masterSync(`✅ Imported ${importedCount} receipt(s) from GPO (skipped ${skippedCount})`, null);
    if (document.querySelector('.nav-btn.active')?.dataset.tab === 'stockMgmt') {
      renderStockManagement();
    } else {
      toast(`Imported ${importedCount} receipts. Switch to Stock Mgmt to see changes.`, 'ok');
    }
  } catch (err) {
    console.error(err);
    toast('Failed to import receipts: ' + err.message, 'err');
  }
};

window.recordStockReceipt = async function() {
  const waybill = document.getElementById('waybillNo')?.value.trim();
  const dateStr = document.getElementById('receiptDate')?.value;
  let emsQtys = BOXES.map((_, i) => parseInt(document.getElementById('recEms_' + i)?.value) || 0);
  let parQtys = BOXES.map((_, i) => parseInt(document.getElementById('recPar_' + i)?.value) || 0);

  if (!waybill) { toast('Enter waybill number', 'warn'); return; }
  if (!dateStr) { toast('Select a date', 'warn'); return; }
  if (emsQtys.every(q => q === 0) && parQtys.every(q => q === 0)) {
    toast('Enter at least one quantity', 'warn');
    return;
  }

  const receiptDate = new Date(dateStr);
  if (isNaN(receiptDate.getTime())) {
    toast('Invalid date', 'err');
    return;
  }
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const monthStr = monthNames[receiptDate.getMonth()] + ' ' + receiptDate.getFullYear();

  if (!MONTHS.includes(monthStr)) {
    toast(`Month "${monthStr}" not found in list`, 'err');
    return;
  }

  if (!STATE.monthlyStock[monthStr]) {
    STATE.monthlyStock[monthStr] = {
      openingEms: [0,0,0,0,0], openingPar: [0,0,0,0,0],
      receivedEms: [0,0,0,0,0], receivedPar: [0,0,0,0,0],
      distributedEms: [0,0,0,0,0], distributedPar: [0,0,0,0,0],
      closingEms: [0,0,0,0,0], closingPar: [0,0,0,0,0],
      movements: []
    };
  }
  const st = STATE.monthlyStock[monthStr];

  let totalBoxes = 0, totalValue = 0;
  for (let i = 0; i < 5; i++) {
    totalBoxes += emsQtys[i] + parQtys[i];
    totalValue += (emsQtys[i] + parQtys[i]) * RATES[`box${i + 1}`];
    st.receivedEms[i] += emsQtys[i];
    st.receivedPar[i] += parQtys[i];
    st.closingEms[i] = st.openingEms[i] + st.receivedEms[i] - st.distributedEms[i];
    st.closingPar[i] = st.openingPar[i] + st.receivedPar[i] - st.distributedPar[i];
  }

  st.movements.push({
    waybill: waybill,
    date: dateStr,
    emsQtys: [...emsQtys],
    parQtys: [...parQtys],
    totalBoxes: totalBoxes,
    totalValue: totalValue
  });

  const idx = MONTHS.indexOf(monthStr);
  for(let k = idx; k < MONTHS.length - 1; k++){
    const thisM = MONTHS[k];
    const nextM = MONTHS[k+1];
    if(!STATE.monthlyStock[nextM]){
      STATE.monthlyStock[nextM] = {
        openingEms: [0,0,0,0,0], openingPar: [0,0,0,0,0],
        receivedEms: [0,0,0,0,0], receivedPar: [0,0,0,0,0],
        distributedEms: [0,0,0,0,0], distributedPar: [0,0,0,0,0],
        closingEms: [0,0,0,0,0], closingPar: [0,0,0,0,0],
        movements: []
      };
    }
    const thisSt = STATE.monthlyStock[thisM];
    const {distEms: dE, distPar: dP} = getLedgerDistributed(thisM);
    const tDistEms = dE;
    const tDistPar = dP;
    const tOpen = getDerivedOpening(thisM);
    const newClosingEms = tOpen.openingEms.map((v,i)=> v + (thisSt.receivedEms[i]||0) - tDistEms[i]);
    const newClosingPar = tOpen.openingPar.map((v,i)=> v + (thisSt.receivedPar[i]||0) - tDistPar[i]);
    STATE.monthlyStock[thisM].closingEms = newClosingEms;
    STATE.monthlyStock[thisM].closingPar = newClosingPar;
    STATE.monthlyStock[nextM].openingEms = [...newClosingEms];
    STATE.monthlyStock[nextM].openingPar = [...newClosingPar];
  }

  STATE.monthlyStock._lastModified = Date.now();
  try { localStorage.setItem('ghanaPostStockBackup', JSON.stringify(STATE.monthlyStock)); } catch(e) {}
  await masterSync(`✅ Received ${totalBoxes} boxes (Waybill: ${waybill}) for ${monthStr}`, null);
  renderStockManagement();
  toast(`Receipt recorded for ${monthStr}`);
};
